<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/dev/null command map</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1d1f23; --muted:#6b7078; --line:#e2e2de; --accent:#1f5fbf;
  --live:#1f7a4d; --live-bg:#e3f3ea; --plan:#8a5a00; --plan-bg:#fbefd5;
  --state:#7a4a00; --state-bg:#fdeccb; --person:#5a3a9a; --person-bg:#ece5fa; --gate:#444; --gate-bg:#ececec;
  --bad:#b3261e; --bad-bg:#fbe4e2; --good:#1f7a4d; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171a; --panel:#1e2125; --ink:#e7e8ea; --muted:#9aa0a8; --line:#33373d; --accent:#7ab0ff;
    --live:#7fd6a3; --live-bg:#1d3a2b; --plan:#f0c36b; --plan-bg:#3b2f14;
    --state:#f0c36b; --state-bg:#3b2f14; --person:#c3aef5; --person-bg:#31274d; --gate:#c9ccd1; --gate-bg:#2e3238;
    --bad:#ff8f87; --bad-bg:#3d1f1d; --good:#7fd6a3;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 20px 0;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font:600 17px/1.2 var(--mono);margin:0 0 2px}
.sub{color:var(--muted);font-size:12px}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0 10px}
input[type=search],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
input[type=search]{min-width:260px}
.btn{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{font:inherit;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:18px 20px;align-items:start}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.pad{padding:14px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
table.matrix{border-collapse:collapse;width:100%;font-size:13px}
table.matrix th,table.matrix td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center}
table.matrix th{font-weight:600;cursor:pointer;color:var(--muted);position:sticky;top:0;background:var(--panel)}
table.matrix th.sel{color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
table.matrix td.key{text-align:left;font-family:var(--mono);cursor:pointer}
table.matrix td.key:hover{color:var(--accent)}
table.matrix td.p{font-family:var(--mono)}
.fx-bad{color:var(--bad)} .fx-good{color:var(--good)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-right:6px}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font:12px/1.5 var(--mono);white-space:nowrap}
.chip.state{background:var(--state-bg);color:var(--state)}
.chip.person{background:var(--person-bg);color:var(--person)}
.chip.gate{background:var(--gate-bg);color:var(--gate)}
.chip.planned{border:1px dashed currentColor}
.chip.live{background:var(--live-bg);color:var(--live);font-family:inherit}
.chip.plan{background:var(--plan-bg);color:var(--plan);font-family:inherit}
.chip.cost{background:none;border:1px solid var(--line);color:var(--muted)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.group{margin-bottom:12px;overflow:hidden}
.group>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;font-weight:600}
.group>summary::-webkit-details-marker{display:none}
.group>summary::before{content:"\25B8";color:var(--muted);font-size:11px;width:10px}
.group[open]>summary::before{content:"\25BE"}
.group .gnote{color:var(--muted);font-weight:400;font-size:12px}
.row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:4px 14px;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.row.child{padding-left:34px}
.cname{font:600 13px var(--mono);word-break:break-word}
.cdesc{color:var(--muted);font-size:13px}
.row .chips{grid-column:2}
@media (max-width:640px){.row{grid-template-columns:1fr}.row .chips{grid-column:1}}
aside{position:sticky;top:132px;max-height:calc(100vh - 150px);overflow:auto}
aside h2{font:600 15px var(--mono);margin:0 0 4px;word-break:break-word}
aside h3{font:600 11px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
aside p{margin:4px 0}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word;font-family:var(--mono);font-size:12px}
a.go{color:var(--accent);cursor:pointer;text-decoration:none;font-family:var(--mono);font-size:12px}
a.go:hover{text-decoration:underline}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:3px 0;font-size:13px}
.dir-up{color:var(--good)}.dir-down{color:var(--bad)}.dir-varies,.dir-drift,.dir-set{color:var(--muted)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 12px;border-top:1px solid var(--line);font-size:13px;vertical-align:top}
th{cursor:pointer;color:var(--muted);font-weight:600;border-top:0;position:sticky;top:0;background:var(--panel)}
tr.vrow{cursor:pointer}tr.vrow:hover,tr.vrow.sel{background:color-mix(in srgb,var(--accent) 9%,transparent)}
td.mono{font-family:var(--mono);font-size:12px}
.path details{margin:2px 0 2px 16px;border-left:1px solid var(--line);padding-left:10px}
.path summary{cursor:pointer;padding:2px 0}
.path .leaf{margin:2px 0 2px 26px;color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:24px;text-align:center}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 14px}
.stat div{min-width:90px}.stat b{display:block;font-size:22px}
.bad{color:var(--bad)}.good{color:var(--good)}
</style>
</head>
<body>
<header>
  <h1>/dev/null &nbsp;command map</h1>
  <div class="sub" id="sub"></div>
  <div class="top">
    <input type="search" id="q" placeholder="Search commands, variables, text...  (try: evidence, hack, trust)" autocomplete="off">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="commands">Commands</button>
      <button role="tab" data-tab="variables">Variables</button>
      <button role="tab" data-tab="path">Unlock path</button>
      <button role="tab" data-tab="responses">Responses</button>
      <button role="tab" data-tab="health">Health</button>
    </nav>
  </div>
</header>
<main>
  <section id="view"></section>
  <aside class="card pad" id="detail"><p class="note">Click a command or a variable to see its detail here.</p></aside>
</main>
<script>
const D = /*DATA*/null;
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)){ if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const byName = Object.fromEntries(D.commands.map(c => [c.name, c]));
const groupOf = Object.fromEntries(D.groups.map(g => [g.id, g]));
const varMap = Object.fromEntries(D.variables.map(v => [v.name, v]));
const UP = new Set(["up","set","varies","drift"]);

// ---- indexes
function condVars(cond){ // the variable keys a condition tests, with thresholds
  if (cond.special) return [];
  return Object.entries(cond.when).map(([k,n]) => [(cond.scope === "person" ? "person." : "") + k, n]);
}
const needs = {};   // var -> [{cmd, n, kind}]
for (const c of D.commands) for (const [kind, list] of [["runs when", c.requires], ["appears when", c.hidden]])
  for (const cond of list) for (const [v,n] of condVars(cond)) (needs[v] ||= []).push({cmd:c, n, kind, cond});
const raisers = {}, lowerers = {}, effectsOf = {};
for (const e of D.effects){
  (UP.has(e.dir) ? (raisers[e.var] ||= []) : (lowerers[e.var] ||= [])).push(e);
  if (e.by) (effectsOf[e.by] ||= []).push(e);
}
const kids = {};
for (const c of D.commands) if (c.parent && byName[c.parent]) (kids[c.parent] ||= []).push(c.name);

// ---- state
const S = {tab:"commands", sel:null, selVar:null, selWatcher:null, q:"", group:"", status:"", ctx:"", sort:"name", path:null,
  openGroups:new Set(), openPath:new Set()};   // everything starts collapsed; what you open stays open

// ---- small renderers
function expandBtns(){
  const all = () => [...document.querySelectorAll("#view details")];
  const expand = () => {
    for (let pass = 0; pass < 6 && all().length < 1500; pass++){
      const closed = all().filter(d => !d.open);
      if (!closed.length) break;
      closed.forEach(d => { d.open = true; if (d._fill) d._fill(); });
    }
  };
  const collapse = () => all().forEach(d => { d.open = false; });
  return [h("button",{class:"btn",onclick:expand}, "Expand all"), h("button",{class:"btn",onclick:collapse}, "Collapse all")];
}
function chipFor(cond){
  const cls = cond.gate ? "gate" : cond.scope;
  const txt = cond.gate ? cond.label : cond.label.replace(">=", " ≥ ");
  return h("span", {class:`chip ${cls}${cond.planned ? " planned" : ""}`, title:cond.hint || ""}, txt);
}
function costChips(c){
  const out = [];
  if (c.hours) out.push(h("span",{class:"chip cost"}, `${c.hours}h`));
  if (c.money) out.push(h("span",{class:"chip cost"}, `$${c.money}`));
  return out;
}
function statusChip(c){ return h("span",{class:`chip ${c.live ? "live" : "plan"}`}, c.live ? "live" : "planned"); }
function goCmd(name, label){ return h("a",{class:"go", onclick:ev=>{ev.stopPropagation(); pickCmd(name);}}, label || name); }
function goVar(name){ return h("a",{class:"go", onclick:ev=>{ev.stopPropagation(); pickVar(name);}}, name); }
function matches(c){
  if (S.group && c.group !== S.group) return false;
  if (S.status && (c.live ? "live" : "planned") !== S.status) return false;
  if (S.ctx && !c.contexts.includes(S.ctx)) return false;
  if (!S.q) return true;
  const hay = [c.name, c.syntax, c.desc, c.group, c.handler, c.rule, ...c.aliases,
    ...c.requires.map(x=>x.label), ...c.hidden.map(x=>x.label)].join(" ").toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(t => hay.includes(t));
}

// ---- Commands tab
function viewCommands(){
  const wrap = h("div");
  const sel = (id, opts, key, all) => {
    const s = h("select",{id, onchange:e=>{S[key]=e.target.value; render();}}, h("option",{value:""}, all),
      ...opts.map(([v,l]) => h("option",{value:v, selected: S[key]===v}, l)));
    return s;
  };
  wrap.append(h("div",{class:"filters"},
    sel("fg", D.groups.map(g=>[g.id, g.title||g.id]), "group", "All groups"),
    sel("fs", [["live","Live"],["planned","Planned"]], "status", "Live and planned"),
    sel("fc", D.contexts.map(c=>[c.id,c.id]), "ctx", "All contexts"), expandBtns()));
  let shown = 0;
  for (const g of D.groups){
    const members = D.commands.filter(c => c.group === g.id && matches(c));
    if (!members.length) continue;
    shown += members.length;
    const roots = members.filter(c => !c.parent || !members.some(m => m.name === c.parent));
    const rows = [];
    const addRow = (c, depth) => {
      rows.push(h("div",{class:`row${depth ? " child":""}${S.sel===c.name?" sel":""}`, onclick:()=>pickCmd(c.name)},
        h("div",{class:"cname"}, c.syntax, c.items ? h("span",{class:"chip live",style:"margin-left:8px"}, `${(kids[c.name]||[]).length} ${c.items.replace("_"," ")} items`) : null),
        h("div",{class:"cdesc"}, c.desc),
        h("div",{class:"chips"}, statusChip(c), costChips(c),
          c.requires.map(chipFor), c.hidden.length ? h("span",{class:"note"}, "appears when:") : null, c.hidden.map(chipFor))));
      for (const k of (kids[c.name]||[]).filter(k => members.some(m => m.name === k))) addRow(byName[k], depth+1);
    };
    roots.forEach(c => addRow(c, 0));
    const filtering = !!(S.q || S.group || S.status || S.ctx);
    const gd = h("details",{class:"group card", open: filtering || S.openGroups.has(g.id)},
      h("summary",{}, g.title || g.id, h("span",{class:"gnote"}, `${members.length} · ${g.description||""}`)), rows);
    gd.addEventListener("toggle", () => { if (!filtering) { gd.open ? S.openGroups.add(g.id) : S.openGroups.delete(g.id); } });
    wrap.append(gd);
  }
  if (!shown) wrap.append(h("div",{class:"card empty"}, "Nothing matches."));
  return wrap;
}

// ---- Variables tab
function viewVariables(){
  const q = S.q.toLowerCase();
  let rows = D.variables.filter(v => !q || v.name.toLowerCase().includes(q) || (v.hint||"").toLowerCase().includes(q));
  const cnt = (m, v) => (m[v.name]||[]).length;
  const key = {name:v=>v.name, state:v=>v.live?0:1, need:v=>-cnt(needs,v), raise:v=>-cnt(raisers,v)}[S.sort];
  rows = rows.slice().sort((a,b) => { const x=key(a), y=key(b); return x<y?-1:x>y?1:a.name.localeCompare(b.name); });
  const th = (k, t) => h("th",{onclick:()=>{S.sort=k; render();}}, t + (S.sort===k ? " ▾" : ""));
  return h("div",{class:"card",style:"overflow:auto"}, h("table",{},
    h("thead",{}, h("tr",{}, th("name","Variable"), th("state","In the game"), h("th",{},"Start"), th("need","Needed by"), th("raise","Changed by"))),
    h("tbody",{}, rows.map(v => {
      const n = cnt(needs,v), r = cnt(raisers,v);
      const gap = n && !r && v.live && !v.person && (v.start==null || v.start<1);
      return h("tr",{class:`vrow${S.selVar===v.name?" sel":""}`, onclick:()=>pickVar(v.name)},
        h("td",{class:"mono"}, v.name),
        h("td",{}, h("span",{class:`chip ${v.live?"live":"plan"}`}, v.live?"in game":"planned")),
        h("td",{class:"mono"}, v.start ?? "—"),
        h("td",{}, n || "—"),
        h("td",{class: gap ? "bad" : ""}, r || (n ? "nothing yet" : "—")));
    }))));
}

// ---- Unlock path
function pathTree(cmd, depth, seen, id=""){
  const wrap = h("div");
  const conds = [["runs when", cmd.requires], ["appears when", cmd.hidden]];
  let any = false;
  for (const [label, list] of conds){
    for (const cond of list){
      any = true;
      if (cond.special){ wrap.append(h("div",{class:"leaf"}, `${label}: admin mode (testing only)`)); continue; }
      if (cond.planned && !Object.keys(cond.when).length){ wrap.append(h("div",{class:"leaf bad"}, `${label}: ${cond.label} (an idea that is not built yet: ${cond.hint})`)); continue; }
      for (const [v,n] of condVars(cond)){
        const vv = varMap[v] || {};
        const rs = (raisers[v]||[]);
        const free = vv.start != null && vv.start >= n && !v.startsWith("person.");
        const sum = h("summary",{}, h("span",{class:"note"}, label+" "), h("b",{class:"mono"}, `${v} ≥ ${n}`), " ",
          free ? h("span",{class:"chip live"},"true at the start") : rs.length ? null : h("span",{class:"chip bad"}, v.startsWith("person.") ? "per person" : "nothing raises this yet"));
        const key = `${S.path}|${id}|${label}|${v}`;
        const det = h("details",{open: S.openPath.has(key)}, sum);
        det.addEventListener("toggle", () => { det.open ? S.openPath.add(key) : S.openPath.delete(key); });
        let filled = false;
        const fill = () => {
          if (filled || free) return; filled = true;
          const seenBy = new Set();
          for (const e of rs){
            const key = (e.by||"") + "|" + (e.via||"") + "|" + e.how;
            if (seenBy.has(key)) continue; seenBy.add(key);
            if (e.by && byName[e.by]){
              const sub = byName[e.by];
              const line = h("div",{class:"leaf"}, "raised by ", goCmd(e.by), h("span",{class:"note"}, ` — ${e.via ? e.via + ": " : ""}${e.how}`));
              det.append(line);
              if (depth < 5 && !seen.has(e.by)){
                const s2 = new Set(seen); s2.add(e.by);
                const t = pathTree(sub, depth+1, s2, `${id}/${e.by}`);
                if (t.childNodes.length) det.append(h("div",{class:"path"}, t));
              } else if (seen.has(e.by)) det.append(h("div",{class:"leaf"}, "(already on this path)"));
            } else det.append(h("div",{class:"leaf"}, `${e.via || "the world"}: ${e.how}`));
          }
        };
        det._fill = fill;
        det.addEventListener("toggle", fill);
        if (det.open) fill();
        wrap.append(det);
      }
    }
  }
  if (!any && depth === 0) wrap.append(h("div",{class:"leaf good"}, "No conditions: available from day 1."));
  return wrap;
}
function viewPath(){
  const opts = D.commands.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const sel = h("select",{onchange:e=>{S.path=e.target.value; S.openPath.clear(); render();}}, h("option",{value:""}, "Choose a command..."),
    ...opts.map(c => h("option",{value:c.name, selected:S.path===c.name}, `${c.name}${c.live?"":"  (planned)"}`)));
  const box = h("div",{class:"card pad path"}, h("div",{class:"filters"}, sel, expandBtns(),
    h("span",{class:"note"}, "Read it top-down: what must be true, then what makes it true, then what that needs.")));
  const c = byName[S.path];
  if (c){
    box.append(h("p",{}, h("b",{class:"mono"}, c.syntax), "  ", statusChip(c), " ", costChips(c)), h("p",{class:"cdesc"}, c.desc), pathTree(c, 0, new Set([c.name])));
  } else box.append(h("div",{class:"empty"}, "Pick a command to see everything a player must do before it works."));
  return box;
}

// ---- Health
function viewHealth(){
  const wrap = h("div");
  const live = D.commands.filter(c=>c.live).length;
  wrap.append(h("div",{class:"card pad"}, h("div",{class:"stat"},
    h("div",{}, h("b",{}, D.commands.length), "commands"), h("div",{}, h("b",{}, live), "live"),
    h("div",{}, h("b",{}, D.commands.length-live), "planned"), h("div",{}, h("b",{}, D.groups.length), "groups"),
    h("div",{}, h("b",{}, D.variables.length), "variables"),
    h("div",{}, h("b",{class: D.problems.length ? "bad":"good"}, D.problems.length), "problems"))));
  wrap.append(h("div",{class:"card pad",style:"margin-top:14px"}, h("h3",{style:"margin:0 0 8px"}, "Checker"),
    D.problems.length ? h("ul",{class:"plain"}, D.problems.map(p=>h("li",{class:"bad"}, p))) : h("p",{class:"good"}, "OK - no problems found." + (D.deep ? "" : " (structure only)"))));
  // live commands whose conditions nothing can ever satisfy
  const stuck = [];
  for (const c of D.commands.filter(c=>c.live)) for (const cond of c.requires.concat(c.hidden))
    for (const [v,n] of condVars(cond)){
      const vv = varMap[v]||{};
      if (v.startsWith("person.")) continue;
      if ((vv.start ?? 0) >= n) continue;
      if (!(raisers[v]||[]).length) stuck.push([c.name, v, n]);
    }
  wrap.append(h("div",{class:"card pad",style:"margin-top:14px"}, h("h3",{style:"margin:0 0 8px"}, "Live commands that can never unlock"),
    stuck.length ? h("ul",{class:"plain"}, stuck.map(([c,v,n])=>h("li",{}, goCmd(c), ` needs ${v} ≥ ${n}, and nothing raises ${v}`))) : h("p",{class:"good"}, "None. Every live condition can be reached.")));
  // planned commands blocked by variables nothing changes
  const blocked = {};
  for (const c of D.commands.filter(c=>!c.live)) for (const cond of c.requires.concat(c.hidden))
    for (const [v,n] of condVars(cond)){
      if (v.startsWith("person.") || (varMap[v]||{}).start >= n || (raisers[v]||[]).length) continue;
      (blocked[v] ||= new Set()).add(c.name);
    }
  const bl = Object.entries(blocked).sort((a,b)=>b[1].size-a[1].size);
  wrap.append(h("div",{class:"card pad",style:"margin-top:14px"}, h("h3",{style:"margin:0 0 4px"}, "What the planned commands are waiting for"),
    h("p",{class:"note"}, "Values no rule changes yet. Building the thing that raises one of these frees the commands listed under it."),
    h("ul",{class:"plain"}, bl.map(([v,set])=>h("li",{}, h("b",{class:"mono"}, v), ` (${set.size}): `, [...set].slice(0,12).map((n,i)=>[i?", ":"", goCmd(n)]), set.size>12 ? ", ..." : "")))));
  return wrap;
}

// ---- Detail panel
function section(title, ...kids){ return [h("h3",{}, title), ...kids.flat().filter(Boolean)]; }
function detailCmd(c){
  const e = effectsOf[c.name] || [];
  const out = [h("h2",{}, c.syntax), h("div",{class:"chips"}, statusChip(c), h("span",{class:"chip cost"}, groupOf[c.group]?.title || c.group), costChips(c)),
    h("p",{}, c.desc)];
  out.push(...section("Runs when", c.requires.length ? h("div",{class:"chips"}, c.requires.map(chipFor)) : h("p",{class:"note"}, "No conditions."),
    c.locked_message ? h("p",{class:"note"}, `When blocked the player sees: "${c.locked_message}"`) : null));
  out.push(...section("Appears when", c.always ? h("p",{class:"note"}, "Always visible.") : c.hidden.length ? h("div",{class:"chips"}, c.hidden.map(chipFor)) : h("p",{class:"note"}, "From the start.")));
  if (e.length) out.push(...section("What it changes", h("ul",{class:"plain"}, e.map(x => h("li",{}, goVar(x.var), " ", h("span",{class:`dir-${x.dir}`}, x.how), x.via ? h("span",{class:"note"}, ` · ${x.via}`) : null)))));
  if (c.footprint) out.push(...section("Who answers it", h("div",{class:"chips"},
    Object.entries(c.footprint.odds).sort((a,b)=>b[1]-a[1]).map(([w,p]) => h("span",{class:"chip bad", title:"base chance, before how closely they are watching"}, `${watcherTitle(w)} ${Math.round(p*100)}%`))),
    h("p",{class:"note"}, `Base chance each time you do this (from ${c.footprint.key}). It rises as they watch you more.`)));
  else if (c.live && c.handler && !kids[c.name]) out.push(...section("Who answers it", h("p",{class:"note"}, "Nobody. This action draws no response.")));
  if (kids[c.name]) out.push(...section("Options", h("ul",{class:"plain"}, kids[c.name].map(k=>h("li",{}, goCmd(k, byName[k].syntax), h("span",{class:"note"}, "  " + byName[k].desc))))));
  if (c.parent) out.push(...section("Part of", h("p",{}, goCmd(c.parent))));
  out.push(...section("Where it lives", h("dl",{class:"kv"},
    h("dt",{}, c.gen ? "Defined in" : "File"), h("dd",{}, c.file || "—"),
    c.handler ? [h("dt",{},"Handler"), h("dd",{}, c.handler)] : null,
    c.rule ? [h("dt",{},"Rule"), h("dd",{}, c.rule)] : null,
    c.screen ? [h("dt",{},"Screen"), h("dd",{}, c.screen)] : null,
    h("dt",{},"Contexts"), h("dd",{}, c.contexts.join(", ")),
    c.aliases.length ? [h("dt",{},"Aliases"), h("dd",{}, c.aliases.join(", "))] : null,
    c.online ? [h("dt",{},"Needs"), h("dd",{}, "a laptop (online action)")] : null)));
  if (c.examples.length) out.push(...section("Examples", h("ul",{class:"plain"}, c.examples.map(x=>h("li",{}, h("code",{}, x.cmd), h("div",{class:"note"}, x.shows))))));
  out.push(h("p",{style:"margin-top:14px"}, h("a",{class:"go",onclick:()=>{S.path=c.name; S.tab="path"; render();}}, "Show the unlock path →")));
  return out;
}
function detailVar(v){
  const out = [h("h2",{}, v.name), h("div",{class:"chips"}, h("span",{class:`chip ${v.live?"live":"plan"}`}, v.live ? "in the game" : "planned"),
    v.start != null ? h("span",{class:"chip cost"}, `starts at ${v.start}`) : null), v.hint ? h("p",{class:"note"}, `Hint shown when it fails: "${v.hint.replace("N", "<n>")}"`) : null];
  const nd = needs[v.name] || [];
  out.push(...section(`Needed by (${nd.length})`, nd.length ? h("ul",{class:"plain"}, nd.map(x=>h("li",{}, goCmd(x.cmd.name), h("span",{class:"note"}, ` ${x.kind} ≥ ${x.n}`), x.cmd.live ? null : h("span",{class:"chip plan",style:"margin-left:6px"}, "planned")))) : h("p",{class:"note"}, "No command tests it.")));
  const rs = raisers[v.name] || [], ls = lowerers[v.name] || [];
  const li = x => h("li",{}, x.by ? goCmd(x.by) : h("span",{class:"mono"}, x.via || "the world"), h("span",{class:`dir-${x.dir}`}, "  " + x.how), x.by && x.via ? h("span",{class:"note"}, ` · ${x.via}`) : null);
  out.push(...section(`Raised or set by (${rs.length})`, rs.length ? h("ul",{class:"plain"}, rs.map(li)) : h("p",{class:"note"}, v.start != null && v.live ? "Nothing changes it." : "Nothing yet.")));
  if (ls.length) out.push(...section(`Lowered by (${ls.length})`, h("ul",{class:"plain"}, ls.map(li))));
  return out;
}
function renderDetail(){
  const box = $("#detail"); box.replaceChildren();
  if (S.tab === "responses" && S.selWatcher && watcherById[S.selWatcher]) box.append(...detailWatcher(watcherById[S.selWatcher]).filter(Boolean));
  else if (S.tab === "path" && S.path && byName[S.path]) box.append(...detailCmd(byName[S.path]).filter(Boolean));
  else if (S.tab === "variables" && S.selVar && varMap[S.selVar]) box.append(...detailVar(varMap[S.selVar]).filter(Boolean));
  else if (S.sel && byName[S.sel]) box.append(...detailCmd(byName[S.sel]).filter(Boolean));
  else if (S.selVar && varMap[S.selVar]) box.append(...detailVar(varMap[S.selVar]).filter(Boolean));
  else box.append(h("p",{class:"note"}, "Click a command or a variable to see its detail here."));
}

// ---- wiring
function pickCmd(name){ S.sel = name; S.selVar = null; if (S.tab === "variables" || S.tab === "health") { S.tab = "commands"; } render(); }
function pickVar(name){ S.selVar = name; S.sel = null; S.tab = "variables"; render(); }
const R = D.responses || {watchers:[], footprints:[]};
const watcherById = Object.fromEntries(R.watchers.map(w => [w.id, w]));
function watcherTitle(id){ return (watcherById[id] || {}).title || id; }
function commandForKey(key){
  const [verb, item] = key.split(".");
  return byName[item ? `${verb}_${item}` : verb] || null;
}
function fxChip(v, x){
  const txt = Array.isArray(x) ? `${x[0]} to ${x[1]}` : (x > 0 ? `+${x}` : `${x}`);
  return h("span",{class:"chip state"}, `${v} ${txt}`);
}
function viewResponses(){
  if (!R.watchers.length) return h("div",{class:"card empty"}, "No data/responses.yaml found.");
  const rows = R.footprints.slice().sort((a,b) => Object.values(b.odds).reduce((x,y)=>x+y,0) - Object.values(a.odds).reduce((x,y)=>x+y,0));
  const q = S.q.toLowerCase();
  const shown = rows.filter(r => !q || r.key.toLowerCase().includes(q));
  const head = h("tr",{}, h("th",{style:"text-align:left"}, "Action"),
    ...R.watchers.map(w => h("th",{class: S.selWatcher===w.id ? "sel":"", onclick:()=>{ S.selWatcher = w.id; S.sel = null; render(); }}, w.title)));
  const body = shown.map(r => h("tr",{},
    h("td",{class:"key", onclick:()=>{ const c = commandForKey(r.key); if (c){ S.sel = c.name; S.selWatcher = null; render(); } }}, r.key),
    ...R.watchers.map(w => { const p = r.odds[w.id];
      return h("td",{class:"p", style: p ? `background:color-mix(in srgb, var(--bad) ${Math.min(70, p*170)}%, transparent)` : ""}, p ? `${Math.round(p*100)}%` : ""); })));
  const quiet = D.commands.filter(c => c.live && c.handler && !kids[c.name] && !c.footprint && !c.group.match(/^(system|admin)$/)).map(c => c.name);
  return h("div",{},
    h("div",{class:"card pad"},
      h("p",{class:"note", style:"margin:0 0 10px"}, "How likely each watcher is to answer each action, before attention (how closely they are looking). Active from day 1. Click a column for what that watcher does; click an action for its command."),
      h("div",{style:"overflow:auto"}, h("table",{class:"matrix"}, h("thead",{}, head), h("tbody",{}, body)))),
    h("div",{class:"card pad", style:"margin-top:14px"}, h("h3",{style:"margin-top:0"}, "No response"),
      h("p",{class:"note"}, "Live actions that draw nothing: ", quiet.length ? quiet.join(", ") : "none")));
}
function detailWatcher(w){
  const a = w.attention || {};
  const out = [h("h2",{}, w.title), h("p",{class:"note"}, "Attention multiplies every chance in its column (kept between 0.25 and 3):"),
    h("p",{}, h("code",{}, `${a.bias ?? 1}` + Object.entries(a.terms||{}).map(([v,c]) => ` ${c<0?"-":"+"} ${Math.abs(c)}×${v}`).join("")))];
  out.push(...section("What it does", h("div",{}, w.responses.map(r => h("div",{style:"margin:0 0 12px"},
    h("div",{}, h("span",{class:"bar", style:`width:${Math.round(r.share*80)}px`}), h("b",{class:"mono"}, r.id), h("span",{class:"note"}, `  ${Math.round(r.share*100)}% of its answers (weight ${r.weight})`)),
    h("div",{class:"note"}, `"${r.msg}"`),
    h("div",{class:"chips", style:"margin-top:4px"}, Object.entries(r.effects).map(([v,x]) => fxChip(v,x)),
      Object.keys(r.if).length ? h("span",{class:"note"}, "only if " + Object.entries(r.if).map(([v,n]) => `${v} ≥ ${n}`).join(", ")) : null))))));
  return out;
}
function render(){
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", b.dataset.tab === S.tab);
  const v = {commands:viewCommands, variables:viewVariables, path:viewPath, responses:viewResponses, health:viewHealth}[S.tab]();
  $("#view").replaceChildren(v);
  renderDetail();
  history.replaceState(null, "", "#" + S.tab + (S.sel ? "/" + S.sel : S.selVar ? "/" + S.selVar : ""));
}
$("#sub").textContent = `Built ${D.generated} from data/commands/ and the rules files. Read-only: edit the YAML, then run python tools/cmdview.py.`;
$("#q").addEventListener("input", e => { S.q = e.target.value; render(); });
$("#tabs").addEventListener("click", e => { const t = e.target.dataset.tab; if (t){ S.tab = t; render(); } });
const hash = location.hash.slice(1).split("/");
if (["commands","variables","path","responses","health"].includes(hash[0])) S.tab = hash[0];
if (hash[1]){ if (byName[hash[1]]) S.sel = hash[1]; else if (varMap[hash[1]]) S.selVar = hash[1]; if (S.tab === "path" && S.sel) S.path = S.sel; }
render();
</script>
</body>
</html>
