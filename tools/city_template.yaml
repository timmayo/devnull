# ---------------------------------------------------------------
# FICTIONAL LAYER: everyone who acts is invented. Keep the rules.
# ---------------------------------------------------------------
fictional:
  generation:
    seed_source: run_seed
    name_pools:
      surnames: pools/__STATE_SLUG___surnames.txt
      given: pools/given_names.txt
    collision_check:
      enabled: true
      rule: 'reject any generated name + role that matches a real person holding that role in this city, now or
        in the recent past. Applies to every role, including mayor and police chief.

        '
      blocklist: pools/__ID___real_officials_blocklist.txt
      include_roles:
      - mayor
      - police_chief
      - council_member
      - city_manager
      - city_attorney
  cast_templates:
    mayor:
      count: 1
    council_members:
      count_from: real.government_structure.council_size
    city_staff:
      roles:
      - city_manager
      - planning_director
      - city_attorney
    police:
      roles:
      - police_chief
      - patrol_officer
      - sergeant
      - detective
    lawyers:
      roles:
      - public_interest
      - corporate_counsel
    reporters:
      roles:
      - local_reporter
      - editor
    developer:
      type: generated shell developer + parent corp
    pacs:
      count: 2
    proposed_site:
      type: fictional parcel in a real zoned corridor
  fictional_analogues:
    utility_actor: generated; inherits rate structure from the real utility's public tariff
    outlet_actor: generated outlet name; real outlet never appears as an actor
  plot_rules:
  - Real people never appear.
  - Real companies, utility, and outlets never take plot actions.
  - Fictional office-holders may take any alignment, including corrupt or incompetent.
  - Fictional office-holders get invented backgrounds; never copy a real incumbent's biography, party, term dates,
    or distinctive traits.
  - Scenario must not mirror a live local dispute.

display:
  disclaimer: "Set in a real city. Items with a link are real and point to their source. Everything else (all characters, organizations and events in the story) is fictional."
  digest_notes: {}

news:
  real_events: []        # real headlines tied to dates: {id, window: [start, end], text, source, published, url, retrieved}
  national_real: []
  fillers:               # invented small-town items for quiet days (about 6 for `all`, 2-3 per season)
    all: []
    winter: []
    spring: []
    summer: []
    fall: []

events: []               # real dated events: {id, title, start, end, time, hours, kind, venue, source, url, retrieved}
