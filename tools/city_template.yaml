# cities/__ID__.yaml  (made by tools/newcity.py; read cities/README.txt)
# Every `VERIFY` is something still to research. Replace it with the value, its source and the date you got it.
# tools/citycheck.py __ID__ lists what is left; a city ships when it has no blockers.
schema_version: 2

city:
  id: __ID__
  display_name: "__NAME__"
  state: "__STATE__"
  status: draft                 # draft = unfinished: hidden from the city menu. Set to released when tools/citycheck.py passes.
  content_version: "0.1"
  min_game_version: "0.0.1"

# ---------------------------------------------------------------
# RESOURCES: every outside page this city's content comes from. The admin provides the URLs.
# kind: facts | events | feed | roster | other.   url: null = still needed (a blocker until it has one).
# Give each resource its own entry and fill `covers` with the facts it supports. Add entries as needed.
# ---------------------------------------------------------------
resources:
  - { id: need_geography, kind: facts, name: "__NAME__: geography", url: null, covers: [real.geography.neighborhoods, real.geography.watershed, real.geography.climate, real.geography.industrial_corridors], note: "NEEDED: URL(s) for this section; add one resource per source" }
  - { id: need_demographics, kind: facts, name: "__NAME__: demographics", url: null, covers: [real.demographics.population, real.demographics.median_income, real.demographics.top_industries, real.demographics.tax_base_notes], note: "NEEDED: URL(s) for this section; add one resource per source" }
  - { id: need_government, kind: facts, name: "__NAME__: government structure", url: null, covers: [real.government_structure.form, real.government_structure.mayor_powers, real.government_structure.council_size, real.government_structure.ward_system, real.government_structure.meeting_schedule, real.government_structure.election_calendar, real.government_structure.recall_rules], note: "NEEDED: URL(s) for this section; add one resource per source" }
  - { id: need_law, kind: facts, name: "__NAME__: law", url: null, covers: [real.law.open_meetings, real.law.public_records, real.law.zoning_process, real.law.utility_commission, real.law.state_preemption_baseline], note: "NEEDED: URL(s) for this section; add one resource per source" }
  - { id: need_conditions, kind: facts, name: "__NAME__: conditions", url: null, covers: [real.conditions.utility_rate_trend, real.conditions.water_supply, real.conditions.grid_operator, real.conditions.existing_dc_activity], note: "NEEDED: URL(s) for this section; add one resource per source" }
  - { id: need_institutions, kind: facts, name: "__NAME__: background institutions", url: null, covers: [real.background_institutions.police_department, real.background_institutions.utility, real.background_institutions.local_press], note: "NEEDED: URL(s) for this section; add one resource per source" }
  - { id: need_city_calendar, kind: events, name: "__NAME__ official meeting calendar", url: null, note: "NEEDED: the city or council meeting schedule" }
  - { id: need_local_calendar, kind: events, name: "__NAME__ local events calendar", url: null, note: "NEEDED: tourism bureau, chamber or library events page" }
  - { id: need_local_feed, kind: feed, name: "__NAME__ local news feed", url: null, scope: "local", note: "NEEDED: an RSS feed URL ({city} and {state} are filled in)" }
  - { id: need_officials_roster, kind: roster, name: "Published rosters of __NAME__ office-holders (now and recent past)", url: null, note: "NEEDED: roster page(s); names go in the blocklist file" }

# ---------------------------------------------------------------
