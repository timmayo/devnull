  demographics:
    population:      { value: "196,608 (Census population estimate, July 1, 2023); 198,917 at the April 2020 census", source: "https://www.census.gov/quickfacts/grandrapidscitymichigan", retrieved: "2026-11-07" }
    median_income:   { value: "$65,526 median household income (2023 dollars, ACS 5-year 2019-2023)", source: "https://www.census.gov/quickfacts/grandrapidscitymichigan", retrieved: "2026-11-07" }
    top_industries:  { value: "Employment of residents, 2024: manufacturing 17,186; health care and social assistance 16,686; retail trade 11,367", source: "https://datausa.io/profile/geo/grand-rapids-mi", retrieved: "2026-11-07", note: "DataUSA is a secondary source built on Census data" }
    tax_base_notes:  { value: "FY2027 adopted fiscal plan: $786 million total (6.4% above FY2026); General Fund revenue projected at $207 million, growing about 4.86% from property and income tax revenues; millage rate reduced to 8.7511 (down 0.1076 mills, 1.2%)", source: "https://www.grandrapidsmi.gov/city-news/posts/city-commission-adopts-786-million-fy2027-fiscal-plan/", retrieved: "2026-11-07" }
  government_structure:           # structure only, no people
    form:            { value: "Commission-Manager form, adopted by Grand Rapids voters in 1916; the elected City Commission sets policy and hires a City Manager as chief administrator", source: "https://www.grandrapidsmi.gov/Government/City-Commission", retrieved: "2026-11-07" }
    mayor_powers:    { value: "Elected at large; official head of the city; presides when the Commission makes decisions. Vote and veto powers not stated on the page.", source: "https://www.grandrapidsmi.gov/Government/City-Commission", retrieved: "2026-11-03", status: VERIFY_vote_veto_and_term }
    council_size:    { value: "6 ward commissioners plus the mayor (7 members, implied by '2 per ward' x 3 wards plus mayor). cast_templates.council_members uses 6; the mayor is a separate role.", source: "https://www.grandrapidsmi.gov/government/city-commission/how-the-city-commission-works/", retrieved: "2026-11-03", status: partial }
    ward_system:     { value: "3 wards, 2 commissioners each; four-year overlapping terms; one commissioner per ward chosen every two years", source: "https://www.grandrapidsmi.gov/Government/City-Commission", retrieved: "2026-11-03" }
    meeting_schedule: { value: "Regular meetings on Tuesdays, usually every other week; the adopted 2026 schedule lists 2:00 pm for some meetings and 7:00 pm for others (7:00 pm meetings may be held at a neighborhood location, with community engagement from 5:30 pm); standing committees meet the morning of regular meeting days; written communications for the agenda are due 2:00 pm the Wednesday before; schedule published before Jan 1", source: "https://www.grandrapidsmi.gov/government/city-commission/how-the-city-commission-works/", retrieved: "2026-11-03" }
    election_calendar: { value: "Commission seats are nonpartisan. Voters approved moving commission elections from odd to even years in November 2020; the first even-year election was 2022. The 2024 election had a primary on Aug 6 and a general on Nov 5. One commissioner per ward is chosen every two years.", source: "https://www.wgvunews.org/post/gr-city-commission-will-move-even-year-election-cycle-2022", retrieved: "2026-11-07", confirm: VERIFY_mayor_term_length_and_election_dates_in_charter }
    recall_rules:    { value: "Michigan Election Law: signatures equal to 25% of the votes cast for governor in the official's district; 60 days to collect; petition reason must be clear and factual (county election commission decides, appeal to circuit court); election at least 95 days after filing, on the next May or November election date; terms longer than two years cannot be recalled in the first or last year. Grand Rapids charter recall provisions not yet checked.", source: "https://ballotpedia.org/Michigan_Recall_Law (secondary); primary: MCL 168.951 et seq.", retrieved: "2026-11-03", status: VERIFY_against_statute_and_charter }

  law:
    open_meetings:   { strength: "moderate (design rating, derived from the rules below)", rules: "Special or rescheduled meetings need notice at least 18 hours ahead; closed sessions need a 2/3 roll-call vote for most purposes and must cite the statutory purpose; a court may invalidate a decision made in violation; suit must be brought within 60 days after approved minutes are public (30 days for contracts, bids and bond procedures); a body may cure by reenacting the decision in compliance; intentional violation is a misdemeanor; personal civil liability up to $500 per meeting", citation: "Michigan Open Meetings Act, MCL 15.261 et seq. (sections 15.263, 15.265, 15.267, 15.268, 15.270, 15.272, 15.273); summarized in the Michigan AG OMA Handbook, Oct 2022", source: "https://www.michigan.gov/ag/-/media/Project/Websites/AG/open-meetings/OMA-Handbook-October-2022.pdf", retrieved: "2026-11-03", status: VERIFY_amendments_since_2022 }
    public_records:  { strength: "moderate (design rating)", response_days: "5 business days to respond; one notice of extension of up to 10 business days; silence counts as a denial if the failure was willful and intentional, or the request clearly said FOIA or information in its first 250 words or subject line", citation: "Michigan Freedom of Information Act, MCL 15.235", source: "https://renderpdf.legislature.mi.gov/documents/mcl/pdf/mcl-15-235.pdf", retrieved: "2026-11-03" }
    zoning_process:  { value: "Planning staff review -> Planning Commission public hearing (notice 15 days before) -> Planning Commission recommends (it does not decide) -> City Commission reviews in committee, may hold an additional public hearing -> City Commission decides -> rezoning typically takes effect 30 days after the decision", citation: "City of Grand Rapids, Apply for a Zone Change (city zoning code section not yet checked)", source: "https://www.grandrapidsmi.gov/media/sh0dvtle/zone-change-application-fy27.pdf", retrieved: "2026-11-03", status: VERIFY_code_section_and_mailing_radius }
    utility_commission: { type: "state public service commission (Michigan Public Service Commission)", citation: "MPSC order in Case U-21859 (Consumers Energy), Nov 6, 2025; enabling statute not yet cited", source: "https://www.michigan.gov/mpsc/commission/news-releases/2025/11/06/mpsc-approves-terms-of-service-between-consumers-energy-and-data-centers", retrieved: "2026-11-03", status: VERIFY_statute_and_whether_GR_is_served_by_this_utility }
    state_preemption_baseline: { value: "Local governments hold the main zoning power over data centers. The Michigan Zoning Enabling Act bars exclusionary zoning (a total ban of a land use where there is a demonstrated need). At least 52 Michigan communities had passed data center moratoriums by June 2026 (usually 6 to 12 months). State Senate bills for a one-year statewide moratorium were pending; no preemption bill was described. The state has a sales tax exemption for data centers.", source: "https://www.michiganpublic.org/politics-government/2026-06-29/michigan-communities-are-hitting-pause-on-data-centers-the-clock-is-ticking", retrieved: "2026-11-07", confirm: VERIFY_tax_exemption_year_and_terms_and_bill_status }
  conditions:
    utility_rate_trend: { value: "Consumers Energy electric: MPSC approved $276.6 million on March 27, 2026 (almost 40% less than requested), rates effective May 1, 2026; a 500 kWh residential customer pays $6.46 more per month (6.1%). Consumers Energy gas: MPSC approved $139.2 million on Oct 15, 2026 (about $240 million requested), about 4.3% for a typical residential customer.", source: "https://www.michigan.gov/mpsc/commission/news-releases/2026/03/27/commission-approves-additional-reliability-investments ; https://www.michigan.gov/ag/news/press-releases/2026/10/15/mpsc-approves-139m-rate-hike-for-consumers-energy", retrieved: "2026-11-07" }
    water_supply:       { value: "Lake Michigan water through the Lake Michigan Filtration Plant (built 1962, expanded 1992 to 135 million gallons per day); more than 1,300 miles of water mains; serves more than 325,000 people", source: "https://www.grandrapidsmi.gov/departments/water-system/history/", retrieved: "2026-11-07" }
    grid_operator:      { value: "MISO (Midcontinent Independent System Operator); Consumers Energy sells plant output into MISO and its costs spread across MISO North and Central", source: "https://www.utilitydive.com/news/consumers-energy-campbell-large-load-earnings/805778/", retrieved: "2026-11-07", confirm: VERIFY_against_a_MISO_or_MPSC_document_that_names_the_zone }
    existing_dc_activity: { value: "Switch has run a data center in the former Steelcase Pyramid in Gaines Township for nearly seven years (about 10 million gallons of water last year). Microsoft bought 300+ acres from Steelcase for $45 million in Oct 2024 plus a smaller adjacent parcel, and sought rezoning of the smaller parcel (hearing Dec 18, 2025). Consumers Energy said an unnamed data center could draw up to 1 GW from 2030 and 450 MW of industrial load, including an expanded Switch, was already interconnected.", source: "https://www.wgvunews.org/news/2025-12-16/gaines-township-to-consider-rezoning-for-future-microsoft-data-center ; https://www.utilitydive.com/news/consumers-energy-campbell-large-load-earnings/805778/", retrieved: "2026-11-07" }
  # Real institutions appear as neutral background ONLY.
  # They supply facts (rate structure, department size). They never act in the plot.
  background_institutions:
    police_department:  { staffing: "FY2027 adopted police budget $75.4 million; includes $1.3 million for 10 officers added in FY2026; full staffing of authorized positions was listed as an FY2026 accomplishment. Interim chief Joseph A. Trigg (a chief search was under way in June 2026).", source: "https://www.grandrapidsmi.gov/city-news/posts/city-commission-adopts-786-million-fy2027-fiscal-plan/", retrieved: "2026-11-07", confirm: VERIFY_sworn_headcount_not_on_pages_read }
    utility:            { rate_structure: "Large-load rule (Consumers Energy, Rate GPD data center provision, approved Nov 6, 2025): applies at 100 MW (or aggregated 100 MW where each same-owner site is 20 MW or more); minimum 15-year contract, auto-extends 5 years unless 4 years' written notice; 80% minimum billing demand; exit fee = minimum monthly bill x months remaining, with collateral of half the exit fee. Whether Grand Rapids is in this utility's electric territory is still VERIFY.", source: "https://www.michigan.gov/mpsc/commission/news-releases/2025/11/06/mpsc-approves-terms-of-service-between-consumers-energy-and-data-centers", retrieved: "2026-11-03" }
    local_press:        { type: "daily / weekly", source: "WGVU News (wgvunews.org), FOX 17 (fox17online.com), Spectrum News 1 Michigan, The Rapidian (therapidian.org): each seen in the pages read for this city", retrieved: "2026-11-07", confirm: VERIFY_add_the_daily_paper_and_business_journal_and_check_each_outlet_is_active }
