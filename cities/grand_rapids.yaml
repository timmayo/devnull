# NEWS
# Real items appear only while the in-game date is inside `window` (inclusive).
# Summaries are in our own words; the link is the source. Add items with a
# source, publication date and the date we retrieved it. Fillers are generic and
# fictional: no real names, streets, teams or outlets.
