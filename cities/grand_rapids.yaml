real:
  geography:
    neighborhoods:   { value: "33 neighborhoods: South East End, Eastown, Alger Heights, Baxter, Downtown Grand Rapids, Shawnee Park, Roosevelt Park, North East Citizens Action, Heritage Hill, Fuller Avenue, Millbrook, Ridgemoor, Oakdale, West Grand, Fulton Heights, East Hills, MLK Park, SWAN, Creston, John Ball Park, Garfield Park, East Paris, Madison Area, Ken-O-Sha Park, Westside Connection, South Hill, Southeast Community Association, Belknap Lookout, Michigan Oaks, Ottawa Hills, Eastgate, Midtown Grand Rapids, Black Hills", source: "https://www.atlasbig.com/united-states/grand-rapids/neighborhoods", retrieved: "2026-11-07", confirm: VERIFY_atlasbig_names_no_official_source_compare_with_the_city_neighborhood_association_map }
    watershed:       { value: "The Grand River is 252 miles long, drains about 5,572 square miles across 18 counties, and enters Lake Michigan at Grand Haven; it flows through Grand Rapids", source: "https://en.wikipedia.org/wiki/Grand_River_%28Michigan%29", retrieved: "2026-11-07", confirm: VERIFY_wikipedia_does_not_cite_the_area_figure_replace_with_USGS_or_EGLE }
    climate:         { value: "1991-2020 normals at the Grand Rapids station (NWS annual climate report for 2024): annual mean temperature 49.3 F; annual precipitation 39.40 inches; annual snowfall 77.6 inches", source: "https://forecast.weather.gov/product.php?site=GRR&issuedby=GRR&product=CLA&format=txt&version=1&glossary=0", retrieved: "2026-11-07", note: "January and July means are not in that report; add only if the game needs them" }
    industrial_corridors: { value: "The city names no industrial corridors. Zoning has one industrial district, SD-IT (Special Districts, Industrial Transportation). The community master plan engagement names the Butterworth Area for cleanup of industrial sites and adaptive reuse of industrial buildings.", source: "https://www.grandrapidsmi.gov/departments/planning-department/zoning-maps/ ; https://www.grandrapidsmi.gov/media/wswdrtpt/bridge-to-our-future-appendix-a.pdf", retrieved: "2026-11-07" }
  demographics:
    population:      { value: "196,608 (Census population estimate, July 1, 2023); 198,917 at the April 2020 census", source: "https://www.census.gov/quickfacts/grandrapidscitymichigan", retrieved: "2026-11-07" }
    median_income:   { value: "$65,526 median household income (2023 dollars, ACS 5-year 2019-2023)", source: "https://www.census.gov/quickfacts/grandrapidscitymichigan", retrieved: "2026-11-07" }
    top_industries:  { value: "Employment of residents, 2024: manufacturing 17,186; health care and social assistance 16,686; retail trade 11,367", source: "https://datausa.io/profile/geo/grand-rapids-mi", retrieved: "2026-11-07", note: "DataUSA is a secondary source built on Census data" }
    tax_base_notes:  { value: "FY2027 adopted fiscal plan: $786 million total (6.4% above FY2026); General Fund revenue projected at $207 million, growing about 4.86% from property and income tax revenues; millage rate reduced to 8.7511 (down 0.1076 mills, 1.2%)", source: "https://www.grandrapidsmi.gov/city-news/posts/city-commission-adopts-786-million-fy2027-fiscal-plan/", retrieved: "2026-11-07" }
  government_structure:           # structure only, no people
    form:            { value: "Commission-Manager form, adopted by Grand Rapids voters in 1916; the elected City Commission sets policy and hires a City Manager as chief administrator", source: "https://www.grandrapidsmi.gov/Government/City-Commission", retrieved: "2026-11-07" }
    mayor_powers:    { value: "Elected at large; official head of the city; presides when the Commission makes decisions. Vote and veto powers not stated on the page.", source: "https://www.grandrapidsmi.gov/Government/City-Commission", retrieved: "2026-11-03", status: VERIFY_vote_veto_and_term }
    council_size:    { value: "6 ward commissioners plus the mayor (7 members, implied by '2 per ward' x 3 wards plus mayor). cast_templates.council_members uses 6; the mayor is a separate role.", source: "https://www.grandrapidsmi.gov/government/city-commission/how-the-city-commission-works/", retrieved: "2026-11-03", status: partial }
    ward_system:     { value: "3 wards, 2 commissioners each; four-year overlapping terms; one commissioner per ward chosen every two years", source: "https://www.grandrapidsmi.gov/Government/City-Commission", retrieved: "2026-11-03" }
    meeting_schedule: { value: "Regular meetings on Tuesdays, usually every other week; the adopted 2026 schedule lists 2:00 pm for some meetings and 7:00 pm for others (7:00 pm meetings may be held at a neighborhood location, with community engagement from 5:30 pm); standing committees meet the morning of regular meeting days; written communications for the agenda are due 2:00 pm the Wednesday before; schedule published before Jan 1", source: "https://www.grandrapidsmi.gov/government/city-commission/how-the-city-commission-works/", retrieved: "2026-11-03" }
    election_calendar: { value: "Commission seats are nonpartisan. Voters approved moving commission elections from odd to even years in November 2020; the first even-year election was 2022. The 2024 election had a primary on Aug 6 and a general on Nov 5. One commissioner per ward is chosen every two years. A 2020 charter amendment also moved mayoral elections to presidential election years (the last odd-year mayoral election was Nov 5, 2019, and the mayor's term was extended one year).", source: "https://www.wgvunews.org/news/2020-12-02/gr-city-commission-will-move-to-even-year-election-cycle-in-2022 ; https://en.wikipedia.org/wiki/2019_Grand_Rapids_mayoral_election (secondary)", retrieved: "2026-11-07", confirm: VERIFY_mayor_term_length_and_primary_date_in_charter }
    recall_rules:    { value: "Michigan Election Law: signatures equal to 25% of the votes cast for governor in the official's district; 60 days to collect; petition reason must be clear and factual (county election commission decides, appeal to circuit court); election at least 95 days after filing, on the next May or November election date; terms longer than two years cannot be recalled in the first or last year. Grand Rapids charter recall provisions not yet checked.", source: "https://ballotpedia.org/Michigan_Recall_Law (secondary); primary: MCL 168.951 et seq.", retrieved: "2026-11-03", status: VERIFY_against_statute_and_charter }

  law:
    open_meetings:   { strength: "moderate (design rating, derived from the rules below)", rules: "Special or rescheduled meetings need notice at least 18 hours ahead; closed sessions need a 2/3 roll-call vote for most purposes and must cite the statutory purpose; a court may invalidate a decision made in violation; suit must be brought within 60 days after approved minutes are public (30 days for contracts, bids and bond procedures); a body may cure by reenacting the decision in compliance; intentional violation is a misdemeanor; personal civil liability up to $500 per meeting", citation: "Michigan Open Meetings Act, MCL 15.261 et seq. (sections 15.263, 15.265, 15.267, 15.268, 15.270, 15.272, 15.273); summarized in the Michigan AG OMA Handbook, Oct 2022", source: "https://www.michigan.gov/ag/-/media/Project/Websites/AG/open-meetings/OMA-Handbook-October-2022.pdf", retrieved: "2026-11-07", checked: "Statute text (complete through PA 12 of 2025) read on 2026-11-07: sections 5 (18-hour notice) and 7 (2/3 roll call) are unchanged. Since the Oct 2022 handbook, section 3a (electronic meetings) was amended by 2023 PA 214 (effective Feb 13, 2024) and section 9a (recordings for state licensing boards) was added by 2022 PA 63; neither changes the rules above for a city commission. Source: https://www.legislature.mi.gov/documents/mcl/pdf/MCL-ACT-267-OF-1976.pdf" }
    public_records:  { strength: "moderate (design rating)", response_days: "5 business days to respond; one notice of extension of up to 10 business days; silence counts as a denial if the failure was willful and intentional, or the request clearly said FOIA or information in its first 250 words or subject line", citation: "Michigan Freedom of Information Act, MCL 15.235", source: "https://www.legislature.mi.gov/documents/mcl/pdf/mcl-15-235.pdf", retrieved: "2026-11-03" }
    zoning_process:  { value: "Planning staff review -> Planning Commission public hearing (notice 15 days before) -> Planning Commission recommends (it does not decide) -> City Commission reviews in committee, may hold an additional public hearing -> City Commission decides -> rezoning typically takes effect 30 days after the decision", citation: "City of Grand Rapids zone change application (FY27). State minimum notice, Michigan Zoning Enabling Act MCL 125.3103: notice published in a newspaper at least 15 days before the hearing, and mailed at least 15 days before to owners and occupants within 300 feet of the property. The city zoning ordinance section was not read and may require more.", source: "https://www.grandrapidsmi.gov/media/sh0dvtle/zone-change-application-fy27.pdf ; https://www.legislature.mi.gov/documents/mcl/pdf/mcl-125-3103.pdf", retrieved: "2026-11-07" }
    utility_commission: { type: "state public service commission (Michigan Public Service Commission)", citation: "MPSC order in Case U-21859 (Consumers Energy), Nov 6, 2025; enabling statute Act 3 of 1939, MCL 460.6 (complete power and jurisdiction to regulate all public utilities in the state). Kent County, including Grand Rapids, is the largest metropolitan area in Consumers Energy's electric service territory (Consumers Energy, 2020)", source: "https://www.michigan.gov/mpsc/commission/news-releases/2025/11/06/mpsc-approves-terms-of-service-between-consumers-energy-and-data-centers ; https://www.legislature.mi.gov/documents/mcl/pdf/mcl-460-6.pdf ; https://www.consumersenergy.com/news-releases/news-release-details/2020/11/13/consumers-energy-names-megan-sall-rydecki-as-community-affairs-manager-for-kent-county", retrieved: "2026-11-07" }
    state_preemption_baseline: { value: "Local governments hold the main zoning power over data centers; the Michigan Zoning Enabling Act bars exclusionary zoning (a total ban of a land use where there is a demonstrated need). At least 52 Michigan communities had passed data center moratoriums by June 2026 (usually 6 to 12 months). State incentive: the Enterprise Data Center sales and use tax exemption (House Bill 4906, signed Jan 17, 2025; effective April 2025) for projects with at least $250 million of investment and 30 new jobs at 150% of the regional median wage; no new certifications after Dec 31, 2029; the Michigan Strategic Fund certifies. As of Sept 14, 2026 a one-year statewide moratorium had been introduced in both chambers and a Senate regulation package proposed, with no committee action reported; no preemption bill was described.", source: "https://www.michiganpublic.org/politics-government/2026-06-29/michigan-communities-are-hitting-pause-on-data-centers-the-clock-is-ticking ; https://www.michiganbusiness.org/services/data-center/ ; https://www.route-fifty.com/artificial-intelligence/2026/09/environmentalists-push-michigan-lawmakers-forge-ahead-moratorium-and-regulations-data-centers/415960/ ; https://www.michigan.gov/whitmer/news/press-releases/2025/01/17/governor-whitmer-signs-bills-supporting-technology-and-innovation", retrieved: "2026-11-07", note: "bill status moves fast: re-check before release" }
  conditions:
    utility_rate_trend: { value: "Consumers Energy electric: MPSC approved $276.6 million on March 27, 2026 (almost 40% less than requested), rates effective May 1, 2026; a 500 kWh residential customer pays $6.46 more per month (6.1%). Consumers Energy gas: MPSC approved $139.2 million on Oct 15, 2026 (about $240 million requested), about 4.3% for a typical residential customer.", source: "https://www.michigan.gov/mpsc/commission/news-releases/2026/03/27/commission-approves-additional-reliability-investments ; https://www.michigan.gov/ag/news/press-releases/2026/10/15/mpsc-approves-139m-rate-hike-for-consumers-energy", retrieved: "2026-11-07" }
    water_supply:       { value: "Lake Michigan water through the Lake Michigan Filtration Plant (built 1962, expanded 1992 to 135 million gallons per day); more than 1,300 miles of water mains; serves more than 325,000 people", source: "https://www.grandrapidsmi.gov/departments/water-system/history/", retrieved: "2026-11-07" }
    grid_operator:      { value: "MISO (Midcontinent Independent System Operator). Most of Michigan's Lower Peninsula is MISO Local Resource Zone 7 (MPSC); Consumers Energy, whose electric territory includes Grand Rapids, sells power into MISO's market.", source: "https://www.michigan.gov/documents/mpsc/PRA_Issue_Brief_687463_7.pdf ; https://www.utilitydive.com/news/consumers-energy-campbell-large-load-earnings/805778/ ; https://www.consumersenergy.com/news-releases/news-release-details/2020/11/13/consumers-energy-names-megan-sall-rydecki-as-community-affairs-manager-for-kent-county", retrieved: "2026-11-07" }
    existing_dc_activity: { value: "Switch has run a data center in the former Steelcase Pyramid in Gaines Township for nearly seven years (about 10 million gallons of water last year). Microsoft bought 300+ acres from Steelcase for $45 million in Oct 2024 plus a smaller adjacent parcel, and sought rezoning of the smaller parcel (hearing Dec 18, 2025). Consumers Energy said an unnamed data center could draw up to 1 GW from 2030 and 450 MW of industrial load, including an expanded Switch, was already interconnected.", source: "https://www.wgvunews.org/news/2025-12-16/gaines-township-to-consider-rezoning-for-future-microsoft-data-center ; https://www.utilitydive.com/news/consumers-energy-campbell-large-load-earnings/805778/", retrieved: "2026-11-07" }
