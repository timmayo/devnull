    - id: early_voting_2026
      window: [2026-10-20, 2026-11-02]
      text: "Early voting is open in Grand Rapids. Registered voters can use any of four early-voting sites, and unregistered residents can still register at the city clerk's office with a photo ID and proof of residency."
      source: "FOX 17"
      published: 2026-10-20
      url: "https://www.fox17online.com/news/local-news/grand-rapids/early-voting-begins-in-grand-rapids-what-voters-need-to-know"
      retrieved: 2026-11-03
    - id: general_election_2026
      window: [2026-11-03, 2026-11-03]
      text: "Election Day in Kent County: the November 3, 2026 general election. Same-day registration is available at the city clerk's office with a photo ID and proof of residency."
      source: "Kent County Elections and FOX 17"
      published: 2026-10-20
      url: "https://www.kentcountymi.gov/662/Candidates-Proposals"
      retrieved: 2026-11-03
  national_real:
    - id: monitors_2026
      window: [2026-10-26, 2026-11-03]
      text: "Federal election monitors are deploying to polling sites across the country, including in Michigan, for the Nov 3 election."
      source: "WBUR Here & Now (via WLRN)"
      published: 2026-10-26
      url: "https://www.wlrn.org/national-politics/2026-10-26/what-an-election-monitor-and-trainer-expect-in-michigan-on-nov-3"
      retrieved: 2026-11-03
  fillers:
    all:
      - "Crews close a lane downtown for utility work; expect delays near the river."
      - "A food truck rally draws a crowd on the west side."
      - "A neighborhood group announces a cleanup day for next weekend."
      - "The library extends its evening hours this month."
      - "A water main repair slows traffic on a side street."
      - "Local restaurants report a busy weekend."
    winter:
      - "Plows run overnight as lake-effect snow moves through."
      - "Warming centers open as temperatures drop."
      - "Salt crews work the main roads ahead of an icy morning."
    spring:
      - "Potholes multiply after the thaw; crews patch the worst ones."
      - "Farmers' market stalls start filling up again."
    summer:
      - "Heat advisory: the city opens cooling centers."
      - "Outdoor concerts and festivals fill the weekend."
    fall:
      - "Leaf collection begins in several neighborhoods."
      - "Orchards and cider mills report big weekend crowds."

