[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devnull"
version = "0.0.1"
description = "/dev/null: Take the Power Back! A single-player, terminal-style game."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
devnull = "devnull.ui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
