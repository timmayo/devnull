# PEOPLE - NPC relationships. Options open as trust deepens.
# One command per entry. Format: see README.txt in this folder.

- name: call_sister
  description: Check in with family. Skip it too long and it wears on you.
  cost: {hours: 1}
- name: befriend_neighbor
  description: Small talk now, favors later.
  hidden_until: {apartment_days: 3}
  cost: {hours: 1}
- name: vet_contact
  description: Dig into a new contact before you trust them.
  requires: [laptop_powered]
  hidden_until: {contacts_total: 3}
  cost: {hours: 2}
- name: confide_friend
  description: Share something real. Builds trust fast.
  requires: {person.trust: 15}
  hidden_until: {person.meetings: 3}
  cost: {hours: 2}
- name: date_coworker
  description: Time off the clock. Comfort, and a risk to your cover.
  requires: {person.trust: 10}
  hidden_until: {person.meetings: 3}
  cost: {hours: 2, money: 40}
- name: cultivate_journalist
  description: Feed a reporter small truths. They remember who was useful.
  requires: {person.trust: 20}
  hidden_until: {contacts_press: 1}
  cost: {hours: 2, money: 20}
- name: recruit_hacker
  description: Bring a skilled ally onto your side.
  requires: {person.trust: 30, sk_network_security: 1}
  hidden_until: {person.meetings: 3}
  cost: {hours: 2}
- name: bribe_clerk
  description: Pay for records. Works on the corruptible; can be reported.
  requires: {person.trust: 10}
  hidden_until: {person.meetings: 4, person.trust: 25}
  cost: {hours: 1, money: 150}
  examples:
  - cmd: bribe_clerk martha_reyes
    shows: 'You slide an envelope across the counter. -$150, 1h. Martha pulls the zoning file. [+1 record: site_plan_rev3]'
  - cmd: bribe_clerk martha_reyes --amount 300
    shows: A bigger envelope. Better odds, bigger story if she talks.
- name: recruit_whistleblower
  description: Ask an insider to go on the record. Risky for them and for you.
  requires: {person.trust: 40}
  hidden_until: {contacts_insiders: 1}
  cost: {hours: 2}
- name: cut_liability
  description: Drop a contact who has become a risk. They may not go quietly.
  hidden_until: {person_suspicion: 30}
  cost: {hours: 1}
- name: people
  description: the people you know
  status: implemented
  screen: look_around
  contexts: [world, shell]
  hidden_until: {people_n: 1}
  handler: cmd_people
- name: person
  description: 'one person: standing, skills, history'
  status: implemented
  syntax: person <n>
  screen: look_around
  contexts: [world, shell]
  hidden_until: {people_n: 1}
  handler: cmd_person
- name: meet
  description: spend time with someone you know
  status: implemented
  syntax: meet <n> [action]
  items: people_actions        # one generated command per action in data/people.yaml (people_actions:)
  item_syntax: meet <n> {item}
  screen: people
  hidden_until: {people_n: 1}
  handler: cmd_meet
- name: talk
  description: Start a conversation with someone nearby
  syntax: talk <npc> [topic]
  aliases: [speak, ask]
  handler: cmd_talk
  args:
  - name: npc
    type: npc
    required: true
  - name: topic
    type: topic
    required: false
