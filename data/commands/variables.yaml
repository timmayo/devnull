# The values a condition may test, and the hint shown when the test fails ({n} is the number).
# A variable not listed here is a typo: the checker rejects it. Add it when you invent one.
# Skip `hint` and a sensible default is generated ("Needs <name> N+.").
# A live command may only test values the game really has (the first section); planned commands may
# use the planned ones. When you build a planned value into the game, move it up and make it real.

