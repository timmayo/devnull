# /dev/null world state schema, v1
#
# Every variable the simulation tracks. Content (events, NPCs, dialogue) lives
# in other data files; this file defines state, ranges, and couplings.
#
# Conventions
#   range:      numeric range, or a type / enum
#   scope:      global (default), per_entity (keyed by entity id), per_city
#   driven_by:  what changes it
#   affects:    what it changes
#   visible:    true | false | estimated   (what the player sees; default true)
#   slice:      true if it belongs in the first vertical slice
#   start:      opening value for a new run ("Regulatory Capture" start)

schema_version: 1

meta:
  turn:         { range: int, driven_by: [always advances], affects: [clock, elections, events] }
  date:         { range: date, driven_by: [turn], affects: [election calendar, event windows] }
  event_flags:  { range: "set of booleans", driven_by: [story beats, player choices], affects: [unlocked content, endings] }
  rng_seed:     { range: int, driven_by: [run start], affects: [reproducibility, debugging] }

player:
  cash:               { range: "$ (int)", driven_by: [trades, odd jobs, theft, donations], affects: [tools, bribes, PAC money], visible: true, slice: true }
  reputation:         { range: "-100..100", scope: per_entity, driven_by: [posts, leaks, favors], affects: [npc trust, recruiting, media coverage] }
  legibility:         { range: "0..100", driven_by: [routine, digital footprint, purchases, cover quality, behavioral model accuracy], affects: [surveillance targeting, raid risk, ending path], visible: estimated, slice: true, start: 5 }
  heat:               { range: "0..100", scope: per_entity, entities: [police, fbi, nsa, corp], driven_by: [hacks, leaks, flagged activity], affects: [investigations, account freezes, tails], decay: "differs by agency and by fail-soft state", visible: true, slice: true, start: 0 }
  skills:             { range: "per-skill level", driven_by: [practice, training, npc mentors], affects: [hack success, persuasion, trading edge] }
  tools_access:       { range: "inventory + credentials", driven_by: [purchases, theft, npc gifts], affects: [what you can breach or reach] }
  time_energy:        { range: "per-turn budget", driven_by: [actions taken, sleep], affects: [pacing, tradeoffs], visible: true }
  safe_houses_cover_ids: { range: "count + quality", driven_by: [cash, npc help], affects: [heat reset, legibility] }
  integrity:          { range: "0..100", driven_by: ["gray acts lower it (disinfo, doxxing, sabotage)", honest wins raise it], affects: [reachable endings, npc trust, credibility], visible: open_question }
  burnout:            { range: "0..100", driven_by: [overwork, stress, isolation], affects: [skill penalties, mistakes, quitting] }
  cover_quality:      { range: "0..100", driven_by: [job, habits, cash], affects: [legibility, heat absorption] }
  credibility:        { range: "-100..100", driven_by: [publishing record, integrity], affects: [press weight, court weight], note: "one false story craters it" }
  day_job:            { range: "job + schedule", driven_by: [starting profile], affects: [cash, free time, cover story] }
  rent_bills:         { range: "$ per turn", driven_by: [fixed, events], affects: [cash pressure, risky choices] }
  personal_relationships: { range: "-100..100", scope: per_entity, driven_by: [time spent, secrets kept], affects: [support, leak risk if neglected] }

world_meters:
  ai_capability:      { range: "0..100 (clock)", driven_by: [data center buildout, funding, regulation], affects: [market sentiment, endings, enemy competence, behavioral model accuracy, nsa analytic capacity], slice: true, start: "low-mid, rising fast" }
  public_opinion_ai:  { range: "-100..100", driven_by: [social feeds, leaks, incidents, local anger], affects: [elections, regulation, pac strategy], slice: true, start: "neutral / uninformed" }
  regulatory_pressure: { range: "0..100", driven_by: [elections, scandals, lobbying], affects: [data center permits, corporate behavior], start: 10 }
  market_sentiment:   { range: "-100..100", driven_by: [ai news, leaks, earnings], affects: [corporate budgets, your trading returns], slice: true }
  power_grid_strain:  { range: "0..100", driven_by: [data center load, outages, sabotage], affects: [local backlash, capability pace], start: "low, climbing" }
  surveillance_reach: { range: "0..100", derived: "nsa collection coverage + police camera coverage", affects: [legibility floor], visible: false }
  info_integrity:     { range: "0..100", driven_by: [disinfo, deepfakes, platform policy], affects: [effectiveness of leaks and posts], start: "mid" }

corporations:
  compute_capacity:   { range: "per company", scope: per_entity, driven_by: [capex, permits, grid access], affects: [ai capability] }
  budget:             { range: "$ per company", scope: per_entity, driven_by: [market sentiment, revenue], affects: [lobbying, security spend, hiring] }
  security_posture:   { range: "0..100", scope: per_entity, driven_by: [budget, past breaches], affects: [hack difficulty, detection speed] }
  lobbying_spend:     { range: "$ per company", scope: per_entity, driven_by: [budget, regulatory pressure], affects: [super pac funding, policy outcomes, council capture], start: high }
  pr_standing:        { range: "-100..100", scope: per_entity, driven_by: [scandals, leaks], affects: [stock price, employee loyalty] }
  gov_investment:     { range: "$ per company", scope: per_entity, driven_by: [government policy, scandals], affects: [corp profit, government incentive to protect], start: high }

government:
  incumbents_control: { range: "per seat / party", driven_by: [elections], affects: [regulatory pressure, agency priorities] }
  election_calendar:  { range: "date + races", driven_by: [fixed schedule], affects: [opinion windows, pac activity spikes] }
  agency_priorities:  { range: "per agency", scope: per_entity, driven_by: [control, scandals, threats], affects: [heat generation, investigations] }
  legislation_pipeline: { range: "bills + stage", driven_by: [control, lobbying, opinion], affects: [surveillance reach, ai rules] }
  data_center_permits: { range: "enum: fast_track | normal | restricted", driven_by: [regulatory pressure, council capture], affects: [site stage progression], start: fast_track }

super_pacs:
  war_chest:          { range: "$ per pac", scope: per_entity, driven_by: [donors], affects: [ad spend, candidate viability], start: high }
  ad_saturation:      { range: "per race", driven_by: [war chest], affects: [opinion shifts, vote share] }
  donor_exposure:     { range: "0..100", driven_by: [leaks, investigative reporting], affects: [donor flight, scandal risk] }

police:
  local_presence:     { range: "0..100", scope: per_district, driven_by: [budget, crime stats, events, protests], affects: [stops, tails, physical raids] }
  camera_alpr_coverage: { range: "0..100", scope: per_district, driven_by: [budget, vendor contracts, surveillance reach], affects: [legibility when moving physically] }
  informant_network:  { range: "count + quality", driven_by: [cash, past cases], affects: [detection of safe houses and meetings] }
  corruptibility:     { range: "0..100", scope: per_entity, driven_by: [pay, scandals, leadership], affects: [bribes, tip-offs] }
  community_trust:    { range: "-100..100", driven_by: [incidents, leaks, protests], affects: [public opinion, police funding, local willingness to help you] }
  case_file_on_player: { range: "suspicion 0..100", driven_by: [your local activity], affects: [escalation to fbi referral], slice: true }
  tech_literacy:      { range: "0..100", fixed: 5, affects: [attribution confidence, detection speed] }

fbi:
  open_case_status:   { range: "enum: lead | preliminary | full | grand_jury | indictment", scope: per_case, driven_by: [heat, referrals, nsa tips], affects: [warrants, arrests, asset freezes], slice: true }
  evidence_strength:  { range: "0..100", scope: per_case, driven_by: [your digital and physical trail, natsec flag], affects: [whether a case can be brought or collapses] }
  task_force_allocation: { range: "agents per case", driven_by: [agency priorities, political pressure], affects: [investigation speed, tails] }
  cyber_division_capacity: { range: "0..100", driven_by: [budget, hiring, ai tools], affects: [hack attribution, trace-back speed] }
  undercover_assets:  { range: count, driven_by: [time, your npc contacts], affects: [chance an ally is a plant] }
  political_pressure: { range: "-100..100", driven_by: [incumbents, election results, scandals], affects: [which targets get prioritized] }
  tech_literacy:      { range: "0..100", fixed: 50, affects: [attribution confidence, detection speed] }

nsa:
  collection_coverage: { range: "0..100", scope: per_channel, channels: [telecom, cloud, undersea_cable, social], driven_by: [legal authority, big tech partnerships, taps], affects: [legibility floor, surveillance reach], slice: true }
  analytic_capacity:  { range: "0..100", driven_by: [compute budget, ai capability], affects: [how well it models and predicts you] }
  legal_authority:    { range: "enum: reauthorized | under_challenge | expanded", driven_by: [legislation pipeline, court rulings, leaks], affects: [collection ceiling, backlash risk] }
  corporate_partnerships: { range: "0..100", scope: per_entity, driven_by: [contracts, lobbying], affects: [which big tech data flows to the nsa] }
  attention_queue:    { range: "rank", driven_by: [heat, activity], affects: [whether you are visible at all, nsa-to-fbi tips] }
  attribution_confidence: { range: "0..100", scope: per_hack, driven_by: [tradecraft, tool reuse], affects: [whether a breach gets pinned on you] }
  tech_literacy:      { range: "0..100", fixed: 95, affects: [attribution confidence, detection speed] }

natsec_flag:
  state:              { range: boolean, threshold: tbd, driven_by: [critical infrastructure attacks, foreign contact, hitting gov-invested companies, stolen classified data], affects: [agencies fuse: heat merges, intel flows, evidence strength jumps] }
  lowered_by:         [staying domestic and small, using the press, legal avenues, framing gov investments as the risk]
  clears:             open_question

city_council:
  capture_level:      { range: "0..100", scope: per_city, driven_by: [corp payments, donations, lobbyist access], affects: [zoning votes, willingness to bypass process] }
  payments_received:  { range: "$ + paper trail quality", scope: per_entity, driven_by: [corp lobbying spend], affects: [evidence you can find and leak] }
  procedural_violations: { range: "count + severity", driven_by: [rushed rezonings, skipped notices, open meeting breaches], affects: [grounds for lawsuits, injunctions, recalls] }
  member_vulnerability: { range: "0..100", scope: per_entity, driven_by: [next election date, scandals, local anger], affects: [who flips, who gets recalled] }
  election_recall_window: { range: date, driven_by: [fixed calendar], affects: [when pressure converts to votes] }

data_center_site:
  stage:              { range: "enum: proposed | rezoned | permitted | construction | operational", scope: per_entity, driven_by: [council votes, permits, capex], affects: [cost to stop rises sharply each stage] }
  ownership_opacity:  { range: "0..100", driven_by: [shell companies, ndas, land buying proxies], affects: [difficulty of tracing the project to a mega corp] }
  resource_draw:      { range: "MW / gallons", driven_by: [compute capacity], affects: [utility rates, power grid strain] }
  nuisance_load:      { range: "0..100 each: noise, light, air", driven_by: [operational stage, cut corners], affects: [local anger] }

community:
  utility_rate_index: { range: "% change", scope: per_city, driven_by: [operational data centers, rate cases], affects: [local anger, council vulnerability] }
  water_stress:       { range: "0..100", scope: per_city, driven_by: [site draw, drought], affects: [local anger] }
  jobs_promised_vs_delivered: { range: gap, driven_by: [corp pr vs reality], affects: [credibility of corp claims once exposed] }
  local_anger:        { range: "0..100", scope: per_city, driven_by: [all impacts above], affects: [organizing strength, public opinion] }
  awareness:          { range: "0..100", scope: per_city, driven_by: [local press, leaks, your posts], affects: [whether anger turns into action] }
  local_economic_dependence: { range: "0..100", scope: per_city, driven_by: [tax base, jobs, council budgets], affects: [community splits, cost of a win, organizing strength] }

local_organizing:
  organizing_strength: { range: "0..100", driven_by: [anger, awareness, leaders, resources], affects: [council pressure, turnout, lawsuits] }
  fragmentation:      { range: "0..100", driven_by: [rival factions, burnout, infiltration], affects: [effectiveness of coordinated action] }
  leaders:            { range: npcs, driven_by: [your contact], affects: [allies, co-optation targets] }
  co_optation_risk:   { range: "0..100", driven_by: [community benefit deals, astroturf], affects: [whether the movement gets bought or split] }

local_media:
  press_capacity:     { range: "0..100", driven_by: [newsroom budgets], affects: [reach of leaks, speed of awareness] }

utilities_state:
  rate_case_status:   { range: "enum: open | approved | contested", driven_by: [utility commission, special tariffs], affects: [who pays for the power] }
  state_preemption_risk: { range: "0..100", driven_by: [state legislature, corp lobbying], affects: [whether localities lose the power to say no] }

npcs:
  trust:              { range: "-100..100", scope: per_entity, driven_by: [favors, honesty, time spent, integrity], affects: [access, intel, betrayal risk], slice: true }
  loyalty_vs_leverage: { range: "0..100", scope: per_entity, driven_by: [your history, their incentives], affects: [whether they flip under pressure], visible: false }
  agenda:             { range: "tag: profit | safety | power | ...", scope: per_entity, driven_by: [fixed + events], affects: [which ally or rival they become] }
  knowledge:          { range: "set of secrets / facts", scope: per_entity, driven_by: [position, your queries], affects: [intel you can extract] }
  exposure:           { range: "0..100", scope: per_entity, driven_by: [your contact, their risk], affects: [chance they are compromised via you] }
  source_reliability: { range: "0..100", scope: per_entity, driven_by: [agenda, access], affects: [likelihood of bad intel], visible: false }
  types:
    - { type: local_reporter,          unlocks: [press capacity, awareness],        risk: [layoffs, legal threats, burned sources] }
    - { type: union_rep,               unlocks: [turnout, funding, jobs-side credibility], risk: [split loyalties] }
    - { type: corporate_whistleblower, unlocks: [internal docs, safety failures],   risk: [retaliation, nda suits, being a plant] }
    - { type: state_regulator,         unlocks: [rate case access, enforcement],    risk: [career risk, capture] }
    - { type: public_interest_lawyer,  unlocks: [case strength, standing],          risk: [bandwidth, bar complaints] }
    - { type: rural_coop_manager,      unlocks: [grid data, utility side evidence], risk: [board pressure, supplier dependence] }

social_networks:
  follower_base:      { range: count, scope: per_platform, driven_by: [posting, virality, bots], affects: [reach, opinion influence] }
  algorithmic_favor:  { range: "0..100", driven_by: [content type, platform policy], affects: [reach multiplier] }
  narrative_strength: { range: "0..100", scope: per_topic, driven_by: [posts, coordinated campaigns], affects: [opinion, info integrity] }
  bot_sockpuppet_network: { range: "count + quality", driven_by: [cash, time], affects: [amplification, raises heat if detected] }

courts_legal:
  legal_standing:     { range: "0..100", scope: per_issue, driven_by: [who is affected, records obtained, plaintiff quality], affects: [whether a case can be filed] }
  case_strength:      { range: "0..100", scope: per_case, driven_by: [evidence, procedural violations, document authenticity, credibility, counsel quality], affects: [injunction odds, settlement pressure] }
  judge_disposition:  { range: "-100..100", scope: per_entity, driven_by: [appointment, donors, past rulings], affects: [ruling odds, venue choice] }
  legal_defense_fund: { range: "$", driven_by: [donations, your cash, npc lawyers], affects: [survive slapps, afford appeals] }
  state_ag_posture:   { range: "-100..100", driven_by: [election results, public opinion, scandals], affects: [investigations, amicus filings, consent decrees] }
  case_stage:         { range: "enum: filed | hearing | ruling | appeal | enforced", driven_by: [time, motions], affects: [delay is a weapon for both sides] }

adversary_learning:
  behavioral_model_accuracy: { range: "0..100", scope: per_entity, driven_by: [ai capability, your data trail, pattern repetition], affects: [predicts your next move, detects routines] }
  pattern_memory:     { range: "log of last N actions", driven_by: [your choices], affects: [repeated tactics lose effectiveness] }
  countermeasure_library: { range: set, driven_by: [past incidents], affects: [corps and agencies adapt to tactics you have used] }

information:
  document_authenticity: { range: "0..100", scope: per_item, visible: false, driven_by: [source, planted doc chance, deepfake rate], affects: [whether publishing it blows up on you] }
  verification_level: { range: "enum: unverified | corroborated | confirmed", scope: per_item, driven_by: [verify actions], affects: [safe to publish threshold] }

ambiguity:
  beneficial_ai_use:  { range: "0..100", scope: per_sector, sectors: [medical, accessibility, science], driven_by: [ai capability], affects: [public support for stopping everything] }
  accountability_terms: { range: "set: siting | ratepayer_protection | water_limits | audits | community_benefit", scope: per_site, driven_by: [negotiation, rulings], affects: [a win can be reform, not a blocked site] }

win_durability:
  durability:         { range: "0..100", scope: per_victory, driven_by: [type: ordinance | ruling | law | agreement], affects: [decay rate] }
  enforcement_level:  { range: "0..100", driven_by: [watchdogs, press, funding], affects: [whether rules are followed] }
  repeal_preemption_threat: { range: "0..100", driven_by: [corp lobbying, state legislature, elections], affects: [chance of reversal each cycle] }
  watchdog_capacity:  { range: "0..100", driven_by: [your time, npc org strength], affects: [slows decay, catches violations] }
  decay_clock:        "election and session boundaries"
  formula_note:       "durability follows enforcement level minus repeal / preemption threat"

fail_soft_states:
  under_investigation:     { effect: [reduced time, tails, frozen accounts], exit: [case collapses, settlement] }
  legal_defense:           { effect: [time and cash go to your case, proxies take over operations], exit: [ruling or plea] }
  lying_low:               { effect: [heat and legibility decay fastest, almost no actions], exit: [wait, cover id] }
  operating_through_proxies: { effect: [reduced reach, npcs carry risk], exit: [rebuild trust] }
  exile_relocation:        { effect: [new municipality, new cover], exit: [lose local standing and contacts] }
  stacking:                open_question

news_digest:
  outlet_slant:       { range: "tag + 0..100", scope: per_entity, driven_by: [ownership, press capacity], affects: [how your actions are framed] }
  digest_items_per_turn: { range: list, driven_by: [world events, your actions], affects: [player infers hidden state from coverage] }
  coverage_lag_noise: { range: "0..100", driven_by: [info integrity], affects: [hidden state clarity] }

endings:
  checks: [ai_capability, public_opinion_ai, integrity, win_durability, accountability_terms]
  note: "Endings are world-state thresholds, not boss fights."

vertical_slice:
  variables: [ai_capability, market_sentiment, public_opinion_ai, legibility, cash, heat, npc_trust, police_case_file, fbi_open_case_status, nsa_collection_coverage]
  scope: "5 NPCs, 1 clock, 1 ending, ~30 minutes of play"
