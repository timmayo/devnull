  money: { title: MONEY, description: Earning and moving and hiding cash., order: 6 }
  people: { title: PEOPLE, description: NPC relationships. Options open as trust deepens., order: 7 }
  gear: { title: GEAR, description: Buying and building and upgrading equipment., order: 8 }
