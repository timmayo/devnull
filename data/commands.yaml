# /dev/null commands: the one file you edit.
# The game's command list, the dispatcher, the command tree and the reference doc all read this file.
# Check it with:  .\tools\cmdtree.cmd --check      View it with:  .\tools\cmdtree.cmd
# Rebuild the docs with:  python tools/gen_docs.py
#
# contexts   where the player is. A command only works in the contexts it lists (default: world).
# groups     how `commands` and the docs are laid out, in `order`. Every command's `group` must be a key here.
# gates      named conditions. `when` is a set of state values that must all be at least the number given.
#            `scope: person` gates look at one person you know (meetings, trust, bond, leverage, owes).
#            `hint` is shown when the gate fails. `planned: true` marks a gate whose variable is not in the
#            game yet; only planned commands may use it.
# commands   one entry per thing you can type. Fields:
#   name          verb_noun. The word the player types is the first word of `syntax` (default: the name)
#   group         the group it is drawn under
#   status        planned | implemented (default planned, so leave it out for planned commands)
#                 implemented commands need a `handler`; the game ignores planned ones
#   requires      gates that must hold to run it (the hint says what is missing)
#   hidden_until  gates that must hold before the command appears (sticky, announced when it appears)
#   cost          { hours: n, money: n }; leave out what is zero, leave out `cost` if it is free
#   description   one line shown in the tree, the commands screen and help
#   examples      optional: cmd + shows pairs for `help <command>`
#   --- fields the game uses for live commands ---
#   syntax, aliases, contexts, handler (the Python function), rule (where its numbers live: an action
#   name, shop.<item> or people_actions.<name>), parent (drawn under another command), online,
#   type (shop category), risk, args, locked_message, always_available, screen (which section of the
#   in-game `commands` screen lists it: look_around, internet, darknet, people or admin)
# Words the player types are the command names whose syntax starts with the same word (meet, buy, admin
# also have sub-entries such as meet_coffee that carry their own hours, cost and gates).
# All gate thresholds on planned commands are placeholders; tune them when the command goes live.

