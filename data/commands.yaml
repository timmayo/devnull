    cost: { hours: 1 }
    description: "Ask your boss for a raise. Fails if they think you're slacking."
  - name: visit_clinic
    group: survive
    cost: { hours: 2, money: 60 }
    description: "See a doctor or therapist. Fixes what sleep can't."
  - name: do_exercise
    group: survive
    cost: { hours: 1 }
    description: "Work out or take a walk. Restores energy and clears your head."
  # existing game commands (have handlers)
