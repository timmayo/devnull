    group: survive
    status: implemented
    contexts: [world]
    cost: { hours: 3 }
    handler: cmd_action
    rule: extra_shift
    description: "Pick up a shift. +$45, more burnout."
  - name: rest
    group: survive
    status: implemented
    contexts: [world]
    cost: { hours: 2 }
    handler: cmd_action
    rule: rest
    description: "Sleep, eat, stop. Lowers burnout."

