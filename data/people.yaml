# What you can do with a person. Success chance p = bias + sum(coef * ctx), where ctx has
#   trust, bond (0..1), owes, leverage, honesty, talkative, corruptibility, skills (0..1).
# Failures split into plain fails and backfires by `backfire_share`.
# Hooks: a person action that can reveal a way to fix the laptop.
hooks:
  lead_npc:
    actions: [ask]
    types: [techie]
    min_trust: 25
    p: 0.35
    msg: "{name} mentions they can swap the dead battery in your laptop, for a favor. Come back when they trust you more."

# Each outcome has person-side effects, player-side effects (slice state), and text.
# `plant` effects apply, on top, when the person is secretly reporting on you.
# Counter-intelligence: at events that matter, an agent may be working the room, looking for people who
# could oppose their sponsors and befriending them. chance = meeting `watch` * scale * (base + heat*heat + opinion*opinion).
counter_intel: { scale: 1.0, base: 0.4, heat: 0.01, opinion: 0.004, cap: 0.6 }

people_actions:
  coffee:
    hours: 2
    cost: 8
    help: "Coffee and small talk. Builds trust slowly."
    p: { bias: 0.6, terms: { trust: 0.3, talkative: 0.2 } }
    backfire_share: 0.1
    success:
      person: { trust: { bias: 4, noise: 1 } }
      player: { legibility: { bias: 0.5 } }
      text: "{name} laughs at your joke and stays for a second cup."
    fail:
      person: { trust: { bias: 0.5 } }
      text: "{name} is distracted. The conversation goes nowhere."
    backfire:
      person: { trust: { bias: -2 } }
      text: "You say the wrong thing. {name} leaves early."
  favor:
    hours: 2
    visible: { meetings: 2, trust: 15 }      # shown once the relationship is this deep
    help: "Do something for them. They will remember."
    p: { bias: 0.85 }
    backfire_share: 0.0
    success:
      person: { trust: { bias: 6 }, owes: { bias: 1 } }
      player: { burnout: { bias: 0.5 } }
      text: "You help {name} with a small, real problem. They say they owe you one."
    fail:
      person: { trust: { bias: 1 } }
      text: "You try to help {name}, but it does not come to much."
  ask:
    hours: 1
    visible: { meetings: 2 }      # shown once the relationship is this deep
    help: "Ask for information or help. Needs some trust."
    requires_person: { trust: 20 }
    p: { bias: 0.25, terms: { trust: 0.5, talkative: 0.2, owes: 0.05 } }
    backfire_share: 0.25
    success:
      person: { trust: { bias: -1 }, exposure: { bias: 1 } }
      uses_type_gives: true
      text: "{name} lowers their voice and tells you what they know."
    fail:
      person: { trust: { bias: -1 } }
      text: "{name} shrugs. 'I really can't help with that.'"
    backfire:
      person: { trust: { bias: -4 }, exposure: { bias: 5 } }
      player: { case_file: { bias: 1 } }
      text: "{name} gets nervous, and you are fairly sure they will mention this to someone."
    plant: { case_file: { bias: 3 } }
  confide:
    hours: 2
    visible: { meetings: 3, trust: 20 }      # shown once the relationship is this deep
    help: "Share something real. Builds trust fast, and puts you in their hands."
    requires_person: { trust: 15 }
    p: { bias: 0.5, terms: { trust: 0.4 } }
    backfire_share: 0.3
    success:
      person: { trust: { bias: 8 }, exposure: { bias: 10 }, bond: { bias: 3 } }
      text: "You tell {name} more than you meant to. They listen, and tell you something back."
    fail:
      person: { trust: { bias: 1 } }
      text: "You start to say something, then decide against it. {name} lets it go."
    backfire:
      person: { trust: { bias: -6 }, exposure: { bias: 8 } }
      player: { legibility: { bias: 1.5 } }
      text: "{name} reacts badly. You have said something you cannot take back."
    plant: { case_file: { bias: 6 }, heat: { bias: 2 } }
  flirt:
    hours: 2
    visible: { meetings: 3, trust: 25 }      # shown once the relationship is this deep
    cost: 15
    help: "Charm them. It can help, or go badly wrong."
    requires_person: { trust: 10 }
    p: { bias: 0.35, terms: { trust: 0.3, bond: 0.2 } }
    backfire_share: 0.5
    success:
      person: { trust: { bias: 5 }, bond: { bias: 10 } }
      player: { burnout: { bias: -1 } }
      text: "The evening goes well. {name} smiles at you on the way out."
    fail:
      person: { trust: { bias: -1 } }
      text: "{name} is polite but clearly not interested."
    backfire:
      person: { trust: { bias: -10 }, exposure: { bias: 4 } }
      player: { cred: { bias: -2 } }
      text: "{name} is offended and makes sure you know it."
  bribe:
    hours: 1
    visible: { meetings: 4, trust: 25 }      # shown once the relationship is this deep
    cost: 150
    help: "Pay for help. Works on the corruptible; can be reported by the honest."
    requires_person: { trust: 10 }
    p: { bias: 0.1, terms: { corruptibility: 0.75, honesty: -0.15, trust: 0.15 } }
    backfire_share: 0.6
    success:
      person: { trust: { bias: 3 }, owes: { bias: 1 }, leverage: { bias: 1 } }
      uses_type_gives: true
      player: { legibility: { bias: 1 } }
      text: "{name} takes the envelope without looking at it and gives you what you asked for."
    fail:
      person: { trust: { bias: -8 } }
      text: "{name} pushes the envelope back. 'I will pretend this did not happen.'"
    backfire:
      person: { trust: { bias: -20 }, hostile: { set: 1 } }
      player: { heat: { bias: 8 }, case_file: { bias: 6 }, cred: { bias: -3 } }
      text: "{name} stands up. 'I am going to report this.' They do."
    plant: { case_file: { bias: 8 } }
  extort:
    hours: 2
    visible: { meetings: 3, trust: 20, leverage: 1 }      # shown once the relationship is this deep
    help: "Use what you know about them. They must have something to hide."
    requires_person: { leverage: 1 }
    p: { bias: 0.2, terms: { leverage: 0.1, honesty: -0.2, corruptibility: 0.3 } }
    backfire_share: 0.6
    success:
      person: { trust: { bias: -15 }, exposure: { bias: 5 }, leverage: { bias: -1 } }
      uses_type_gives: true
      player: { cred: { bias: -1 } }
      text: "{name} goes pale, then agrees to everything you ask."
    fail:
      person: { trust: { bias: -12 } }
      text: "{name} calls your bluff. You walk away with nothing."
    backfire:
      person: { trust: { bias: -30 }, hostile: { set: 1 } }
      player: { heat: { bias: 10 }, case_file: { bias: 8 }, cred: { bias: -5 } }
      text: "{name} does not flinch. 'You should be careful who you threaten.'"
    plant: { case_file: { bias: 8 }, heat: { bias: 4 } }
  recruit:
    hours: 2
    visible: { meetings: 5, trust: 40 }      # shown once the relationship is this deep
    help: "Ask them to stand with you. A trusted ally helps every day."
    requires_person: { trust: 50 }
    p: { bias: 0.1, terms: { trust: 0.6, owes: 0.1, bond: 0.1 } }
    backfire_share: 0.2
    success:
      person: { trust: { bias: 3 }, ally: { set: 1 } }
      text: "{name} thinks it over and says yes. You are not alone."
    fail:
      person: { trust: { bias: -2 } }
      text: "{name} says not yet. They want to see more first."
    backfire:
      person: { trust: { bias: -8 }, exposure: { bias: 6 } }
      text: "{name} gets scared off. You hope they do not talk."
    plant: { case_file: { bias: 5 } }
  learn:
    hours: 2
    visible: { meetings: 2, trust: 12 }      # shown once the relationship is this deep
    cost: 0
    help: "Ask them to teach you their best skill. Higher level, bigger gain."
    requires_person: { trust: 20 }
    p: { bias: 0.35, terms: { trust: 0.4, talkative: 0.25 } }
    backfire_share: 0.1
    teaches: true
    success:
      person: { trust: { bias: 1.5 } }
      text: "{name} walks you through {skill}. You come away knowing more."
    fail:
      person: { trust: { bias: 0.5 } }
      text: "{name} tries to explain {skill}, but it does not click today."
    backfire:
      person: { trust: { bias: -1.5 } }
      text: "You ask a naive question about {skill}. {name} seems to doubt you are serious."
