    when: { weekday: 3, nth: 1 }                          # game approximation
    time: "evening"
    hours: 3
    mult: { opinion: 1.1, heat: 1.0 }
    meet_chance: 0.55
    attendees: { developer_staffer: 3, neighbor_activist: 3, public_interest_lawyer: 1.5, local_reporter: 2, lobbyist: 1 }
  web_user_group:
