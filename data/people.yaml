    label: "City Commission meeting"
    watch: 0.35                       # chance weight that a counter-intelligence agent is present
    listing_url: "https://events.grandrapidsmi.gov/meetings"      # where real ones are listed; this entry itself is a game approximation
    when: { weekday: 1, every_other_week: true }          # approximation; real dates replace it (see below)
    approx_unless_listed: true      # skipped in any year where the city file lists real meetings of this kind
    time: "2:00 pm or 7:00 pm"
    hours: 3
    mult: { opinion: 1.3, heat: 1.0 }
    meet_chance: 0.6
    attendees: { local_reporter: 3, neighbor_activist: 3, developer_staffer: 1.5, public_interest_lawyer: 1, state_regulator: 0.5, lobbyist: 0.7, police_officer: 0.5 }
