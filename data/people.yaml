# People, meetings and what you can do with a person (v0).
#
# Every person here is generated and fictional. Meeting TYPES are generic
# categories modeled on kinds of real local meetings (checked against Meetup
# search results for Grand Rapids: web, Python and AI-builder user groups, plus
# neighborhood, labor and civic meetings). Real group names are never used.
# Only the City Commission schedule is a sourced fact (see the city file);
# the rest are game approximations. All numbers are first guesses.

names:
  surnames: pools/mi_surnames.txt
  given: pools/given_names.txt
  blocklist: pools/real_officials_blocklist.txt

trust_bands: [[15, "stranger"], [30, "acquaintance"], [50, "friendly"], [75, "trusted"], [101, "inner circle"]]

# NPC types. Traits are 0..1. plant_p = chance a new person is reporting on you.
# ask_gives = what asking a trusting person for help can yield.
types:
  local_reporter:
    label: "local reporter"
    traits: { honesty: 0.7, talkative: 0.8, corruptibility: 0.10, plant_p: 0.02, loyalty: 0.5 }
    ask_gives: { evidence: 1 }
  union_rep:
    label: "union rep"
    traits: { honesty: 0.6, talkative: 0.6, corruptibility: 0.20, plant_p: 0.03, loyalty: 0.6 }
    ask_gives: { evidence: 2 }
    ally_daily: { opinion: -0.05 }
  corporate_whistleblower:
    label: "worried insider"
    traits: { honesty: 0.5, talkative: 0.4, corruptibility: 0.20, plant_p: 0.10, loyalty: 0.4 }
    ask_gives: { evidence: 8 }
    ally_daily: { evidence: 0.2 }
  state_regulator:
    label: "state regulator"
    traits: { honesty: 0.85, talkative: 0.3, corruptibility: 0.10, plant_p: 0.05, loyalty: 0.5 }
    ask_gives: { evidence: 4 }
    ally_daily: { regulation: 0.02 }
  public_interest_lawyer:
    label: "public-interest lawyer"
    traits: { honesty: 0.8, talkative: 0.5, corruptibility: 0.05, plant_p: 0.03, loyalty: 0.7 }
    ask_gives: { evidence: 3, cred: 1 }
  rural_coop_manager:
    label: "co-op manager"
    traits: { honesty: 0.7, talkative: 0.5, corruptibility: 0.20, plant_p: 0.02, loyalty: 0.5 }
    ask_gives: { evidence: 3 }
  techie:
    label: "software developer"
    traits: { honesty: 0.6, talkative: 0.8, corruptibility: 0.20, plant_p: 0.03, loyalty: 0.5 }
    ask_gives: { skills: 1 }
    ally_daily: { skills: 0.05 }
  neighbor_activist:
    label: "neighborhood activist"
    traits: { honesty: 0.75, talkative: 0.9, corruptibility: 0.10, plant_p: 0.02, loyalty: 0.7 }
    ask_gives: { evidence: 1 }
    ally_daily: { opinion: -0.04 }
  developer_staffer:
    label: "developer's staffer"
    traits: { honesty: 0.3, talkative: 0.5, corruptibility: 0.50, plant_p: 0.20, loyalty: 0.3 }
    ask_gives: { evidence: 5 }
  lobbyist:
    label: "lobbyist"
    traits: { honesty: 0.2, talkative: 0.6, corruptibility: 0.60, plant_p: 0.25, loyalty: 0.2 }
    ask_gives: { evidence: 4 }
  police_officer:
    label: "police officer"
    traits: { honesty: 0.5, talkative: 0.4, corruptibility: 0.35, plant_p: 0.30, loyalty: 0.4 }
    ask_gives: { case_file: -2 }
    ally_daily: { case_file: -0.1 }
  librarian:
    label: "librarian"
    traits: { honesty: 0.9, talkative: 0.9, corruptibility: 0.05, plant_p: 0.01, loyalty: 0.6 }
    ask_gives: { evidence: 2 }

# Meetings. `when` is a schedule: weekday (0 = Monday), `nth` of the month, or
# `every_other_week`. `hours` is the time cost. `mult` scales the base `attend`
# effects. `attendees` are the odds weights for who you can meet there.
# Skills a person can have. Three levels each: beginner (1), advanced (2), expert (3).
# A new person gets 2-3 RELATED skills, drawn from their type's pool plus the pool of the
# event where you met them (event skills count 1.5x), and 1-2 unrelated SIDE skills (hobbies
# and trades). Related skills show up on the person sheet; side skills show once they trust you.
skills:
  levels: [beginner, advanced, expert]
  level_odds: { related: [0.30, 0.45, 0.25], side: [0.50, 0.35, 0.15] }
  # Your own skills use the same three levels. xp needed for beginner / advanced / expert.
  xp_thresholds: [3, 9, 18]
  player_start: { data_analysis: 1 }          # you spend your days in spreadsheets
  catalog:
    python: "Python"
    web_dev: "web development"
    linux: "Linux"
    hardware: "hardware repair"
    network_security: "network security"
    machine_learning: "machine learning"
    data_analysis: "data analysis"
    journalism: "investigative reporting"
    records_law: "public-records law"
    research_archives: "archival research"
    public_speaking: "public speaking"
    land_use: "land use and zoning"
    litigation: "litigation"
    organizing: "community organizing"
    labor_law: "labor relations"
    energy: "utility and energy systems"
    finance: "finance and accounting"
    lobbying: "lobbying"
    police_procedure: "police procedure"
    human_resources: "human resources and hiring"
    marketing: "marketing"
    construction: "construction and contracting"
    leadership: "leadership"
    hospitality: "hospitality and food service"
    design_art: "design and illustration"
  side:
    cooking: "cooking"
    photography: "photography"
    woodworking: "woodworking"
    gardening: "gardening"
    ham_radio: "ham radio"
    music: "playing music"
    running: "distance running"
    chess: "chess"
    home_brewing: "home brewing"
    bicycle_repair: "bicycle repair"
    languages: "foreign languages"
    first_aid: "first aid"
    car_repair: "car repair"
    birdwatching: "birdwatching"
  by_type:
    local_reporter: { journalism: 4, records_law: 2, public_speaking: 1, research_archives: 1 }
    union_rep: { labor_law: 4, organizing: 3, public_speaking: 1, finance: 1 }
    corporate_whistleblower: { data_analysis: 2, finance: 2, machine_learning: 2, network_security: 1, python: 1 }
    state_regulator: { energy: 3, records_law: 2, land_use: 2, finance: 1 }
    public_interest_lawyer: { litigation: 4, records_law: 3, land_use: 1 }
    rural_coop_manager: { energy: 4, finance: 2, organizing: 1 }
    techie: { python: 3, web_dev: 3, linux: 3, hardware: 2, network_security: 2, machine_learning: 1 }
    neighbor_activist: { organizing: 4, public_speaking: 2, land_use: 1, records_law: 1 }
    developer_staffer: { land_use: 3, finance: 2, public_speaking: 1, energy: 1 }
    lobbyist: { lobbying: 4, public_speaking: 2, finance: 1, records_law: 1 }
    police_officer: { police_procedure: 4, network_security: 1, public_speaking: 1 }
    librarian: { research_archives: 4, records_law: 1, web_dev: 1, data_analysis: 1 }
  by_meeting:
    city_commission: { records_law: 2, land_use: 2, public_speaking: 1 }
    planning_commission: { land_use: 3, finance: 1 }
    web_user_group: { web_dev: 3, python: 2, linux: 1 }
    ai_builders_meetup: { machine_learning: 3, python: 2, data_analysis: 2 }
    neighborhood_association: { organizing: 3, land_use: 1 }
    labor_hall: { labor_law: 3, organizing: 2 }
    ratepayers_group: { energy: 3, finance: 1, records_law: 1 }
    library_talk: { research_archives: 2, journalism: 1 }
    business_mixer: { finance: 2, lobbying: 2, public_speaking: 1 }
    policy_forum: { records_law: 2, lobbying: 1, police_procedure: 1, energy: 1 }
    fan_convention: { design_art: 2, hardware: 1, python: 1 }
    webinar: { data_analysis: 1 }
    neighbors_open_house: { organizing: 1, public_speaking: 1 }

meetings:
