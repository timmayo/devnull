version: 1

# Contexts: where the player is. Commands only work in listed contexts.
contexts:
  world:  { description: "Out in the city, on foot" }
  shell:  { description: "Logged into a terminal on your laptop" }

# Gates: named conditions the engine evaluates. Commands reference them.
gates:
  laptop_powered: { description: "Laptop is plugged in or has working battery" }
  has_network:    { description: "Connected to a network" }
  learned_nmap:   { description: "Player has acquired nmap" }

groups:
  system:
    title: "System"
    description: "Game and session control"
    order: 1
  movement:
    title: "Movement"
    description: "Getting around the city"
    order: 2
  inspect:
    title: "Observation"
    description: "Looking at things and people"
    order: 3
  social:
    title: "Social"
    description: "Talking to NPCs"
    order: 4
  hacking:
    title: "Hacking"
    description: "Tools available from the shell"
    order: 5

commands:
  help:
    group: system
    aliases: [h, "?"]
    syntax: "help [command|group]"
    summary: "List commands, or show details for one"
    contexts: [world, shell]
    handler: cmd_help
    always_available: true

  save:
    group: system
    syntax: "save"
    summary: "Save your progress"
    contexts: [world, shell]
    handler: cmd_save

  quit:
    group: system
    aliases: [exit]
    syntax: "quit"
    summary: "Save and exit"
    contexts: [world, shell]
    handler: cmd_quit

  go:
    group: movement
    aliases: [walk, travel]
    syntax: "go <place>"
    summary: "Travel to a location (costs time)"
    contexts: [world]
    args:
      - { name: place, type: location, required: true }
    handler: cmd_go

  look:
    group: inspect
    aliases: [l]
    syntax: "look [target]"
    summary: "Describe your surroundings or something in them"
    contexts: [world]
    args:
      - { name: target, type: entity, required: false }
    handler: cmd_look

  inventory:
    group: inspect
    aliases: [inv, i]
    syntax: "inventory"
    summary: "List what you're carrying"
    contexts: [world, shell]
    handler: cmd_inventory

  talk:
    group: social
    aliases: [speak, ask]
    syntax: "talk <npc> [topic]"
    summary: "Start a conversation with someone nearby"
    contexts: [world]
    args:
      - { name: npc,   type: npc,   required: true }
      - { name: topic, type: topic, required: false }
    handler: cmd_talk

  scan:
    group: hacking
    syntax: "scan <target>"
    summary: "Scan a host for open services"
    contexts: [shell]
    requires: [laptop_powered, has_network, learned_nmap]
    args:
      - { name: target, type: host, required: true }
    handler: cmd_scan
    time_cost: 1
    risk: 0.05

  connect:
    group: hacking
    aliases: [ssh]
    syntax: "connect <host>"
    summary: "Open a session on a host you have access to"
    contexts: [shell]
    requires: [laptop_powered, has_network]
    args:
      - { name: host, type: host, required: true }
    handler: cmd_connect

  terminal:
    group: system
    aliases: [laptop, sh]
    syntax: "terminal"
    summary: "Open your laptop terminal"
    contexts: [world]
    requires: [laptop_powered]
    handler: cmd_open_terminal
