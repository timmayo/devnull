# /dev/null - commands2.yaml (draft: 13 groups x 10 commands)
#
# Fields:
#   name          verb_noun command name (unique)
#   group         noun group the command lives under
#   status        planned | implemented   (default: planned; omitted when planned)
#   requires      conditions needed to USE the command
#   hidden_until  conditions that must be met before the command is SHOWN
#   cost          hours and/or money (omit what is zero; omit all if free)
#   description   one line shown in the tree and in help
#   examples      help text: cmd + sample output (required when implemented)
#
# Rules:
#   - planned commands are hidden from play and help; shown only in the
#     roadmap doc and `help --dev`, marked [planned]
#   - an implemented command may not reference a planned command
#   - an implemented command needs at least one example
#
# Variable prefixes (placeholders; tune during balancing):
#   person_*  contacts_*  skill_*  item_*  money_*  heat_*  rep_*  day/job/apartment flags
#
# All numbers and variable names are placeholders.

